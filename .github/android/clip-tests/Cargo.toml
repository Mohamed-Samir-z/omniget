[package]
name = "clip-harness"
version = "0.1.0"
edition = "2021"
[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
sanitize-filename = "0.6"
serde_json = "1"

fs4 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
