name: Publish YouTube fix test APK
on:
  push:
    branches: [android]
    paths: [.github/workflows/publish-yt-fix-test.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy the verified signed artifact to a separate test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN=44793783634
          SHA=c0ac13dede1f6e505e1a4ec78acf912187448f4d
          TAG=android-yt-fix-test
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.head_sha')" = "$SHA"
          gh run download "$RUN" --name libreget-android-apk --dir dist
          echo '3695993ad908169b94a6643cb62d550ca41ca06f7c904029b6b1ec77ee4f42c4  dist/libreget-android.apk' | sha256sum --check
          cat > notes.md <<'NOTES'
          Test build for on-device verification, not a stable release. The existing android-latest release is unchanged.

          Android now uses a small adaptive initial buffer so slow media responses can show progress promptly. YouTube media attempts with no first bytes after 60 seconds are stopped and retried through the bounded retry path.

          This is the exact signed APK from successful Android APK run 44793783634, commit c0ac13dede1f6e505e1a4ec78acf912187448f4d. Runtime, slow-HTTP startup, gallery and filename checks passed. The exact phone/network behavior still needs retesting.

          Install libreget-android.apk over the existing app and retry the same YouTube link.

          APK SHA-256: 3695993ad908169b94a6643cb62d550ca41ca06f7c904029b6b1ec77ee4f42c4
          NOTES
          # No delete, clobber, or android-latest operation. Fail if this tag exists.
          gh release create "$TAG" dist/libreget-android.apk --target "$SHA" --prerelease --latest=false --title 'Android YouTube startup fix, TEST BUILD' --notes-file notes.md
