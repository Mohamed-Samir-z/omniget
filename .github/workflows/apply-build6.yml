name: Apply reviewed Build 6 sources
on:
  push:
    branches: [android-clip-fixes]
    paths: [.github/workflows/apply-build6.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-clip-fixes
      - name: Apply exact source delta
        env:
          PATCH_ZLIB: 
          PATCH_SHA256: 5644cb5b207558ae1f6809a595736f3f60836848031bb6b40f8f5ab7efc878a6
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB']))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build6.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build6.patch
          git apply /tmp/build6.patch
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install yt-dlp
          cargo test --manifest-path .github/android/clip-tests/Cargo.toml
          cargo build --manifest-path .github/android/clip-tests/Cargo.toml
          python3 .github/android/clip-tests/check_sections.py
          python3 .github/android/clip-tests/check_normalization.py
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri src .github/android
          git commit -m 'Android: unique clip names, normalized duration, H/M/S controls and share Recents cleanup'
          git push origin HEAD:android-clip-fixes
