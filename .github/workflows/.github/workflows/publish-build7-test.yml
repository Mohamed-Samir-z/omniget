name: Publish feature round 7 test APK
on:
  push:
    branches: [android]
    paths: [.github/workflows/publish-build7-test.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy the verified signed artifact to a separate test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN=44922021841
          SHA=e37620212f5685e48d2e4a75061e8dd61d5a8660
          TAG=android-feature-round-7-test
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN" --jq '.head_sha')" = "$SHA"
          gh run download "$RUN" --name libreget-android-apk --dir dist
          APK_SHA=$(sha256sum dist/libreget-android.apk | cut -d' ' -f1)
          echo "APK SHA-256: $APK_SHA"
          cat > notes.md <<NOTES
          Test build for on-device verification, not a stable release. The existing android-latest release is unchanged.

          Focused repair build 7, cumulative with test builds 1 to 6:
          - Accept a clip ending slightly short only within both 0.5 seconds and 5% of its requested span. Preserve the measured duration; overshoot and stream/container checks remain in place.
          - Clamp requested end times beyond a known source duration before downloading. Use the actual endpoint in filenames and show an in-app notice after successful completion.
          - Explain that leaving the end-time field empty means end of video, while preserving empty input.
          - Add the branded native launch cover with the requested friends/download illustration. Remove it when the frontend is ready, skip share-only entry, and retain a timeout escape.

          Verification: all eight checks passed on the final repair PR head. 150 frontend tests, 12-locale key parity, controlled production-code media regression tests, generated Android host compilation and eight native popup/launch-cover tests passed. Phone-width UI and native cover renders were inspected. The signed Android Gradle build, signing and APK inspection succeeded.

          IMPORTANT: real-phone launch timing, clipping/playback in external apps, share-only entry and Recents behavior still need device verification. The exact reported YouTube source could not be downloaded for reproduction because extraction returned a sign-in/bot check. Controlled AV1 media and the exact 12.000/11.652-second regression passed. These are not claims of device verification.

          The larger feature roadmap is not included in this repair build.

          Scheduling remains in More options. Keep omniget running until the scheduled time; it is not an Android system alarm and will not wake a closed app.

          This is the exact signed APK from successful Android APK run 44922021841, commit e37620212f5685e48d2e4a75061e8dd61d5a8660.

          Download the full APK and compare its SHA-256 before installing if Android reports an invalid package. Install libreget-android.apk over the existing app.

          APK SHA-256: $APK_SHA
          NOTES
          gh release create "$TAG" dist/libreget-android.apk --target "$SHA" --prerelease --latest=false --title 'Android repair build 7, TEST BUILD' --notes-file notes.md
