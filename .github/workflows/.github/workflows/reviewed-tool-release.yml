        import urlsplit\n\n_MAX_BYTES = 4 * 1024 * 1024\n_CHUNKS = re.compile(r\''self\\.__next_f\\.push\\(\\[1,("(?:\\\\.|[^"\\\\])*")\\]\\)\'',
