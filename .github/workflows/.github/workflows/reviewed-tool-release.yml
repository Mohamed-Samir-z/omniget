        p.write_text("import importlib.util\nfrom pathlib import Path\nimport tempfile\nimport unittest\nimport zipfile\n\nspec=importlib.util.spec_from_file_location(''sign_manifest'',Path(__file__).with_name(''sign_manifest.py''))\nmodule=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\nclass
        PreparationTests(unittest.TestCase):\n def test_metadata_exact_bounds_and_required_archive(self):\n  with tempfile.TemporaryDirectory()
