        as archive:\n        if len(archive.infolist()) > 10000:\n            raise ValueError(\''Archive entry limit\'')\n        for
        entry in archive.infolist():\n            name = entry.filename\n            if (name in names or name.startswith(\''/\'')
        or \''\\\\\'' in name or \''\\0\'' in name\n                    or any(part in {\''.\'', \''..\''} for part in name.split(\''/\''))\n                    or
