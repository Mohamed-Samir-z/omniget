        (ValueError, RecursionError) as exc:\n                raise ValueError(\''Invalid Snapchat JSON row\'') from exc\n            pos
        += len(text[:end].encode(\''utf-8\''))\n            yield value\n        else:\n            end = raw.find(b\''\\n\'',
        pos)\n            pos = len(raw) if end < 0 else end + 1\n\n\ndef _media_url(value):\n    if not isinstance(value,
        str) or len(value) > 8192 or any(ord(c) <= 32 for c in value):\n        return None\n    try:\n        url = urlsplit(value)\n        host
