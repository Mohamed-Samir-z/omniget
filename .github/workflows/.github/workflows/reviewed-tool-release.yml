name: Reviewed interpreted tool release
permissions:
  contents: read
concurrency:
  group: omniget-tool-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Mohamed-Samir-z/omniget' && github.ref == 'refs/heads/tool-release-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: 'Reviewed source: .github/android/prepare_tool_candidate.py'
      run: 'python3 - <<''SOURCE_FILE''

        from pathlib import Path

        p=Path(''.github/android/prepare_tool_candidate.py'');p.parent.mkdir(parents=True,exist_ok=True)

        p.write_text(''#!/usr/bin/env python3\n"""Prepare only interpreted tools. Fetch, pin, patch, validate. Never publish/sign."""\nimport
        argparse, base64, hashlib, importlib.util, io, json, os, re, subprocess, sys, urllib.error, urllib.request, zipfile\nfrom
        pathlib import Path\n\nHERE = Path(__file__).resolve().parent\n\ndef get(url, limit):\n    if not url.startswith((\''https://api.github.com/repos/yt-dlp/yt-dlp/\'',
        \''https://github.com/yt-dlp/yt-dlp/releases/\'')):\n        raise ValueError(\''Unexpected source\'')\n    with urllib.request.urlopen(urllib.request.Request(url,
        headers={\''User-Agent\'':\''omniget-tool-preflight\'',\''Accept\'':\''application/vnd.github+json\''}), timeout=60)
        as response:\n        data=response.read(limit+1)\n    if len(data)>limit: raise ValueError(\''Source exceeds limit\'')\n    return
        data\n\ndef prepare(output, version=None, expected=None):\n    if version is None:\n        release=json.loads(get(\''https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest\'',2*1024*1024))\n        version=release[\''tag_name\'']\n    if
        not re.fullmatch(r\''\\d{4}\\.\\d{2}\\.\\d{2}\'',version): raise ValueError(\''Unreviewed upstream release format\'')\n    prefix=f\''https://github.com/yt-dlp/yt-dlp/releases/download/{version}/\''\n    checks=get(prefix+\''SHA2-256SUMS\'',256*1024).decode()\n    digests=[line.split()[0]
        for line in checks.splitlines() if len(line.split())==2 and line.split()[1].lstrip(\''*\'')==\''yt-dlp\'']\n    if
        len(digests)!=1 or not re.fullmatch(\''[a-f0-9]{64}\'',digests[0]): raise ValueError(\''Missing exact upstream checksum\'')\n    data=get(prefix+\''yt-dlp\'',16*1024*1024)\n    digest=hashlib.sha256(data).hexdigest()\n    if
        digest!=digests[0] or (expected is not None and digest!=expected): raise ValueError(\''Source digest changed\'')\n    with
        zipfile.ZipFile(io.BytesIO(data)) as original:\n        patch=HERE/\''snapchat-runtime\''\n        if hashlib.sha256(original.read(\''yt_dlp/extractor/snapchat.py\'')).hexdigest()!=patch.joinpath(\''original.sha256\'').read_text().strip():\n            raise
        ValueError(\''Upstream Snapchat changed; patch needs review before release\'')\n        result=io.BytesIO()\n        with
        zipfile.ZipFile(result,\''w\'') as target:\n            for info in original.infolist():\n                body=original.read(info.filename)\n                if
        info.filename==\''yt_dlp/extractor/snapchat.py\'': body=patch.joinpath(\''snapchat.py\'').read_bytes()\n                elif
        info.filename==\''yt_dlp/extractor/lazy_extractors.py\'':\n                    text=body.decode();start=text.index(\''class
        SnapchatSpotlightIE(\'');stop=text.index(\''\\nclass \'',start+1)\n                    old=text[start:stop]\n                    changed=old.replace(\''snapchat\\\\\\\\.com/spotlight/\'',\''snapchat\\\\\\\\.com/(?:@[^/?#]+/)?spotlight/\'').replace(\''(?P<id>\\\\\\\\w+)\'',\''(?P<id>[\\\\\\\\w-]+)\'')\n                    if
        changed==old: raise ValueError(\''Lazy extractor changed\'')\n                    body=(text[:start]+changed+text[stop:]).encode()\n                target.writestr(info,body)\n            info=zipfile.ZipInfo(\''yt_dlp/omniget_snapchat_rsc.py\'',date_time=(2026,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED\n            target.writestr(info,patch.joinpath(\''omniget_snapchat_rsc.py\'').read_bytes())\n    output.mkdir(parents=True,exist_ok=True);archive=output/\''yt-dlp.pyz\'';archive.write_bytes(result.getvalue())\n    spec=importlib.util.spec_from_file_location(\''manifest\'',HERE/\''tool-bundle-tests/sign_manifest.py\'');module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\n    final,size=module.inspect_archive(archive)\n    with
        zipfile.ZipFile(archive) as candidate:\n        for name in candidate.namelist():\n            if name.endswith(\''.py\''):
        compile(candidate.read(name),name,\''exec\'',dont_inherit=True)\n    smoke=subprocess.run([sys.executable,str(archive),\''--ignore-config\'',\''--version\''],check=True,capture_output=True,text=True,timeout=30)\n    if
        smoke.stdout.strip()!=version: raise ValueError(\''Candidate version mismatch\'')\n    metadata={\''version\'':version,\''sourceSha256\'':digest,\''bundleSha256\'':final,\''bytes\'':size}\n    (output/\''candidate.json\'').write_text(json.dumps(metadata,sort_keys=True)+\''\\n\'')\n    print(json.dumps(metadata,sort_keys=True))\n    return
        metadata\n\nif __name__==\''__main__\'':\n    p=argparse.ArgumentParser(description=__doc__);p.add_argument(\''--output\'',type=Path,required=True);p.add_argument(\''--version\'');p.add_argument(\''--source-sha256\'');a=p.parse_args();prepare(a.output,a.version,a.source_sha256)\n'')

        SOURCE_FILE'
    - name: 'Reviewed source: .github/android/release_tool_bundle.py'
      run: 'python3 - <<''SOURCE_FILE''

        from pathlib import Path

        p=Path(''.github/android/release_tool_bundle.py'');p.parent.mkdir(parents=True,exist_ok=True)

        p.write_text(''#!/usr/bin/env python3\n"""The reviewed job only. No native/APK files, no credentials in output."""\nimport
        base64, datetime as dt, hashlib, importlib.util, json, os, re, subprocess, sys, tempfile, urllib.error, urllib.request\nfrom
        pathlib import Path\nHERE=Path(__file__).resolve().parent\nREPO=\''Mohamed-Samir-z/omniget\''\n\ndef inputs():\n    version=os.environ[\''TOOL_VERSION\''];digest=os.environ[\''TOOL_SHA256\''];raw=os.environ[\''TOOL_SEQUENCE\'']\n    if
        not re.fullmatch(r\''\\d{4}\\.\\d{2}\\.\\d{2}\'',version) or not re.fullmatch(\''[a-f0-9]{64}\'',digest) or not re.fullmatch(\''[1-9][0-9]{0,18}\'',raw):
        raise ValueError(\''Invalid release inputs\'')\n    sequence=int(raw)\n    if not 2<=sequence<=9223372036854775807:
        raise ValueError(\''Sequence out of range\'')\n    return version,digest,sequence\n\ndef run(*args):\n    return subprocess.run(args,check=True,capture_output=True,text=True).stdout\n\ndef
        api(path):\n    try:\n        with urllib.request.urlopen(urllib.request.Request(\''https://api.github.com/repos/\''+REPO+\''/\''+path,headers={\''User-Agent\'':\''omniget-tool-release\''}),timeout=30)
        as r:return json.load(r)\n    except urllib.error.HTTPError as e:\n        if e.code==404:return None\n        raise\n\ndef
        summary():\n    version,digest,sequence=inputs();value=json.loads(Path(\''candidate/candidate.json\'').read_text())\n    text=f\''##
        Tool release waiting for Mohamed\\n\\nVersion: {version}\\n\\nSequence: {sequence}\\n\\nUpstream SHA-256: {digest}\\n\\nPatched
        bundle SHA-256: {value["bundleSha256"]}\\n\\nBytes: {value["bytes"]}\\n\\nOnly interpreted yt-dlp plus matched EJS
        and the reviewed Snapchat patch. No APK, native runtime or FFmpeg update. Approving the omniget-tool-release environment
        signs and publishes this exact artifact.\\n\''\n    with open(os.environ[\''GITHUB_STEP_SUMMARY\''],\''a\'') as f:f.write(text)\n\ndef
        publish():\n    version,digest,sequence=inputs()\n    if os.environ.get(\''GITHUB_REPOSITORY\'')!=REPO or os.environ.get(\''GITHUB_REF\'')!=\''refs/heads/tool-release-control\'':raise
        ValueError(\''Wrong release context\'')\n    candidate=Path(\''candidate\'');record=json.loads((candidate/\''candidate.json\'').read_text());archive=candidate/\''yt-dlp.pyz\''\n    spec=importlib.util.spec_from_file_location(\''signer\'',HERE/\''tool-bundle-tests/sign_manifest.py\'');module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\n    actual,size=module.inspect_archive(archive)\n    if
        record!={\''version\'':version,\''sourceSha256\'':digest,\''bundleSha256\'':actual,\''bytes\'':size}:raise ValueError(\''Reviewed
        artifact mismatch\'')\n    root=base64.b64decode(json.loads((HERE/\''tool-release-inputs.json\'').read_text())[\''rootPublicKeyDerBase64\''],validate=True)\n    tag=f\''tool-bundle-{sequence}\''\n    if
        api(\''releases/tags/\''+tag) is not None:raise ValueError(\''Sequence already published; never overwrite immutable
        bundle\'')\n    current=api(\''releases/tags/tool-updates\'')\n    with tempfile.TemporaryDirectory() as temp:\n        p=Path(temp);os.chmod(p,0o700);key=p/\''key.pem\'';key.write_text(os.environ.pop(\''TOOL_SIGNING_KEY\''));os.chmod(key,0o600)\n        pub=p/\''public.der\'';run(\''openssl\'',\''pkey\'',\''-in\'',str(key),\''-pubout\'',\''-outform\'',\''DER\'',\''-out\'',str(pub))\n        if
        pub.read_bytes()!=root:raise ValueError(\''Signing key does not match APK root\'')\n        if current is not None:\n            if
        current[\''draft\'']:raise ValueError(\''Discovery release unexpectedly draft\'')\n            matches=[a for a in
        current[\''assets\''] if a[\''name\'']==\''manifest.json\'']\n            if len(matches)!=1:raise ValueError(\''Existing
        discovery is not verifiable\'')\n            run(\''gh\'',\''release\'',\''download\'',\''tool-updates\'',\''--repo\'',REPO,\''--pattern\'',\''manifest.json\'',\''--dir\'',str(p))\n            envelope=json.loads((p/\''manifest.json\'').read_text());signed=base64.b64decode(envelope[\''signed\''],validate=True);sig=base64.b64decode(envelope[\''signature\''],validate=True)\n            (p/\''signed\'').write_bytes(signed);(p/\''sig\'').write_bytes(sig)\n            run(\''openssl\'',\''dgst\'',\''-sha256\'',\''-verify\'',str(pub),\''-keyform\'',\''DER\'',\''-signature\'',str(p/\''sig\''),str(p/\''signed\''))\n            if
        sequence<=json.loads(signed)[\''sequence\'']:raise ValueError(\''Sequence rollback\'')\n        envelope=p/\''new-manifest.json\'';expiry=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=6)).isoformat()\n        run(sys.executable,str(HERE/\''tool-bundle-tests/sign_manifest.py\''),\''--archive\'',str(archive),\''--sequence\'',str(sequence),\''--version\'',version,\''--expires-at\'',expiry,\''--private-key-file\'',str(key),\''--output\'',str(envelope))\n        key.unlink()\n        notes=p/\''notes.md\'';notes.write_text(f\''Owner-reviewed
        interpreted tool release.\\n\\nVersion {version}, sequence {sequence}.\\n\\nSource SHA-256 {digest}\\n\\nBundle SHA-256
        {actual}\\n\\nNo APK, Python, native library or FFmpeg update.\\n\'')\n        run(\''gh\'',\''release\'',\''create\'',tag,str(archive),\''--repo\'',REPO,\''--draft\'',\''--latest=false\'',\''--target\'',os.environ[\''GITHUB_SHA\''],\''--title\'',f\''Tools
        {version}, sequence {sequence}\'',\''--notes-file\'',str(notes))\n        verified=p/\''verified\'';run(\''gh\'',\''release\'',\''download\'',tag,\''--repo\'',REPO,\''--pattern\'',\''yt-dlp.pyz\'',\''--dir\'',str(verified))\n        if
        hashlib.sha256((verified/\''yt-dlp.pyz\'').read_bytes()).hexdigest()!=actual:raise ValueError(\''Uploaded archive
        mismatch, left draft\'')\n        run(\''gh\'',\''release\'',\''edit\'',tag,\''--repo\'',REPO,\''--draft=false\'',\''--latest=false\'')\n        manifest=p/\''manifest.json\'';manifest.write_bytes(envelope.read_bytes())\n        if
        current is None:\n            run(\''gh\'',\''release\'',\''create\'',\''tool-updates\'',str(manifest),\''--repo\'',REPO,\''--draft\'',\''--latest=false\'',\''--target\'',os.environ[\''GITHUB_SHA\''],\''--title\'',\''Signed
        interpreted tool discovery\'',\''--notes-file\'',str(notes))\n            run(\''gh\'',\''release\'',\''edit\'',\''tool-updates\'',\''--repo\'',REPO,\''--draft=false\'',\''--latest=false\'')\n        else:run(\''gh\'',\''release\'',\''upload\'',\''tool-updates\'',str(manifest),\''--repo\'',REPO,\''--clobber\'')\n        print(\''Owner-approved
        interpreted bundle and signed discovery published. No APK/native update.\'')\n\nif __name__==\''__main__\'':\n    {\''inputs\'':inputs,\''summary\'':summary,\''publish\'':publish}[sys.argv[1]]()\n'')

        SOURCE_FILE'
    - name: 'Reviewed source: .github/android/tool-release-inputs.json'
      run: 'python3 - <<''SOURCE_FILE''

        from pathlib import Path

        p=Path(''.github/android/tool-release-inputs.json'');p.parent.mkdir(parents=True,exist_ok=True)

        p.write_text(''{\n  "schema": 1,\n  "baselineSequence": 1,\n  "rootPublicKeyDerBase64": "",\n  "manifestEndpoint":
        "https://github.com/Mohamed-Samir-z/omniget/releases/download/tool-updates/manifest.json"\n}\n'')

        SOURCE_FILE'
    - name: 'Reviewed source: .github/android/tool-bundle-tests/sign_manifest.py'
      run: 'python3 - <<''SOURCE_FILE''

        from pathlib import Path

        p=Path(''.github/android/tool-bundle-tests/sign_manifest.py'');p.parent.mkdir(parents=True,exist_ok=True)

        p.write_text(''#!/usr/bin/env python3\n"""Offline release preparation only. Never generates a key, uploads or activates
        anything.\nThe caller supplies an existing protected RSA PKCS8 key file. Only the signed envelope\nand public-key
        fingerprint are output. Keep the private key out of the repo/CLI text.\n"""\nimport argparse\nimport base64\nimport
        datetime as dt\nimport hashlib\nimport json\nfrom pathlib import Path\nimport re\nimport subprocess\nimport tempfile\nimport
        zipfile\n\nMAX_BYTES = 16 * 1024 * 1024\nREQUIRED = {\''__main__.py\'', \''yt_dlp/version.py\'', \''yt_dlp/omniget_snapchat_rsc.py\'',\n            \''yt_dlp_ejs/yt/solver/core.min.js\'',
        \''yt_dlp_ejs/yt/solver/lib.min.js\''}\n\n\ndef inspect_archive(path):\n    if not path.is_file() or not 0 < path.stat().st_size
        <= MAX_BYTES:\n        raise ValueError(\''Invalid archive size\'')\n    total = 0\n    names = set()\n    with zipfile.ZipFile(path)
        as archive:\n        if len(archive.infolist()) > 10000:\n            raise ValueError(\''Archive entry limit\'')\n        for
        entry in archive.infolist():\n            name = entry.filename\n            if (name in names or name.startswith(\''/\'')
        or \''\\\\\'' in name or \''\\0\'' in name\n                    or any(part in {\''.\'', \''..\''} for part in name.split(\''/\''))\n                    or
        name.endswith((\''.so\'', \''.dex\'', \''.class\'', \''.exe\''))\n                    or not 0 <= entry.file_size
        <= 32 * 1024 * 1024):\n                raise ValueError(\''Unsafe archive entry\'')\n            names.add(name)\n            total
        += entry.file_size\n            if total > 64 * 1024 * 1024:\n                raise ValueError(\''Expanded archive
        limit\'')\n        if not REQUIRED <= names:\n            raise ValueError(\''Required extractor/EJS/local patch missing\'')\n        if
        archive.testzip() is not None:\n            raise ValueError(\''Corrupt archive member\'')\n    return hashlib.sha256(path.read_bytes()).hexdigest(),
        path.stat().st_size\n\n\ndef prepare(archive, sequence, version, expiry, now):\n    if type(sequence) is not int or
        sequence < 2 or sequence > 9223372036854775807:\n        raise ValueError(\''Sequence must exceed bundled baseline\'')\n    if
        not re.fullmatch(r\''[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}(?:[._-][A-Za-z0-9]+)*\'', version):\n        raise ValueError(\''Invalid
        version\'')\n    if not now < expiry <= now + 7 * 86400000:\n        raise ValueError(\''Expiry must be within seven
        days\'')\n    digest, size = inspect_archive(archive)\n    return {\''schema\'': 1, \''sequence\'': sequence, \''expiresAt\'':
        expiry,\n            \''runtimeAbi\'': \''omniget-python-3.12-ejs-v1\'', \''patches\'': [\''snapchat-rsc-v1\''],\n            \''sha256\'':
        digest, \''bytes\'': size,\n            \''url\'': f\''https://github.com/Mohamed-Samir-z/omniget/releases/download/tool-bundle-{sequence}/yt-dlp.pyz\'',\n            \''version\'':
        version}\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\''--archive\'',
        type=Path, required=True)\n    parser.add_argument(\''--sequence\'', type=int, required=True)\n    parser.add_argument(\''--version\'',
        required=True)\n    parser.add_argument(\''--expires-at\'', required=True, help=\''ISO timestamp with timezone\'')\n    parser.add_argument(\''--private-key-file\'',
        type=Path, required=True)\n    parser.add_argument(\''--output\'', type=Path, required=True)\n    args = parser.parse_args()\n    expiry
        = dt.datetime.fromisoformat(args.expires_at.replace(\''Z\'', \''+00:00\''))\n    if expiry.tzinfo is None:\n        parser.error(\''Expiry
        needs an explicit timezone\'')\n    if args.output.exists():\n        parser.error(\''Output already exists; refusing
        replacement\'')\n    if args.private_key_file.is_symlink() or not args.private_key_file.is_file():\n        parser.error(\''Private
        key must be an existing protected regular file\'')\n    if args.private_key_file.stat().st_mode & 0o077:\n        parser.error(\''Private
        key file must not be readable by group/others\'')\n    value = prepare(args.archive, args.sequence, args.version,
        int(expiry.timestamp()*1000),\n                    int(dt.datetime.now(dt.timezone.utc).timestamp()*1000))\n    signed
        = json.dumps(value, separators=(\'',\'', \'':\''), ensure_ascii=True).encode()\n    # openssl reads the protected
        file directly. No private key text in arguments/output.\n    with tempfile.TemporaryDirectory() as temp:\n        message
        = Path(temp) / \''message\''\n        signature = Path(temp) / \''signature\''\n        public = Path(temp) / \''public.der\''\n        message.write_bytes(signed)\n        subprocess.run([\''openssl\'',
        \''dgst\'', \''-sha256\'', \''-sign\'', str(args.private_key_file),\n                        \''-out\'', str(signature),
        str(message)], check=True, capture_output=True)\n        subprocess.run([\''openssl\'', \''pkey\'', \''-in\'', str(args.private_key_file),
        \''-pubout\'',\n                        \''-outform\'', \''DER\'', \''-out\'', str(public)], check=True, capture_output=True)\n        key_info
        = subprocess.run([\''openssl\'', \''pkey\'', \''-pubin\'', \''-inform\'', \''DER\'', \''-in\'', str(public),\n                                   \''-text\'',
        \''-noout\''], check=True, capture_output=True, text=True).stdout\n        match = re.search(r\''Public-Key: \\((\\d+)
        bit\\)\'', key_info)\n        if not match or int(match[1]) not in range(2048, 4097) or \''Exponent:\'' not in key_info:\n            raise
        ValueError(\''A reviewed RSA key of 2048 to 4096 bits is required\'')\n        envelope = {\''signed\'': base64.b64encode(signed).decode(),\n                    \''signature\'':
        base64.b64encode(signature.read_bytes()).decode()}\n        with args.output.open(\''x\'', encoding=\''utf-8\'') as
        output:\n            json.dump(envelope, output, separators=(\'',\'', \'':\''))\n            output.write(\''\\n\'')\n        print(\''Prepared
        signed envelope. No upload or activation performed.\'')\n        print(\''Public key SHA-256:\'', hashlib.sha256(public.read_bytes()).hexdigest())\n\n\nif
        __name__ == \''__main__\'':\n    main()\n'')

        SOURCE_FILE'
