name: Apply reviewed Build 7 sources
on:
  push:
    branches: [android-build7]
    paths: [.github/workflows/apply-build7.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build7
      - name: Apply exact source delta
        env:
          PATCH_ZLIB: 
          PATCH_SHA256: 7655e928053f1c278f8181674b027d0db9d4dbe0f278f4f42ad9d4e049c6f73b
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB']))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build7.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build7.patch
          git apply /tmp/build7.patch
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install yt-dlp
          cargo test --manifest-path .github/android/clip-tests/Cargo.toml
          cargo build --manifest-path .github/android/clip-tests/Cargo.toml
          python3 .github/android/clip-tests/check_sections.py
          python3 .github/android/clip-tests/check_normalization.py
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-build7.yml
          git add src-tauri src .github/android .github/workflows/apply-build7.yml
          git commit -m 'Android: bounded clip rounding, EOF notice, optional end hint and branded launch cover'
          git push origin HEAD:android-build7
