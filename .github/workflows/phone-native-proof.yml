name: Native soft audio visual and accelerated playback measurements
permissions:
  actions: read
  contents: read
jobs:
  native-delayed-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Materialize isolated native test sources, no full-app or release build
      shell: bash
      run: 'mkdir -p /tmp/player-proof

        cd /tmp/player-proof

        python3 - <<''PYCODE''

        import base64,tarfile,io,lzma,pathlib

        tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode('''')))).extractall(''.'')

        p=pathlib.Path(''app/src/main/res/raw/fixture.mp4'');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(lzma.decompress(base64.b64decode('''')));(p.parent/''scenery.mp4'').write_bytes(p.read_bytes())

        PYCODE

        chmod +x gradlew

        '
    - name: Build test-only x86_64 package and instrumentation
      shell: bash
      run: 'cd /tmp/player-proof

        ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2

        '
    - name: Boot accelerated emulator and run actual playback acceptance
      timeout-minutes: 10
      shell: bash
      run: "set -euxo pipefail\ntrap 'cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk\ndf -h /\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;default;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;default;x86_64'\necho disk.dataPartition.size=2G >> \"$ANDROID_AVD_HOME/player-proof.avd/config.ini\"\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -avd player-proof -partition-size 2048 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\n\"$ADB\" shell settings put global device_provisioned 1\n\"$ADB\" shell settings put secure user_setup_complete 1\n\"$ADB\" shell input keyevent 82\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n\"$ADB\" logcat -c\n\"$ADB\" logcat -v threadtime > /tmp/player-live.log 2>&1 &\nLOGPID=$!\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\ntimeout 270 \"$ADB\" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-result.txt\ngrep -E 'OmnigetProof|MediaCodec|CCodec|AudioTrack|AndroidRuntime' /tmp/player-live.log | tail -350\nkill \"$LOGPID\"\nfor image in queue-sheet audio-light audio-dark options-light options-dark failure; do\n \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat \"cache/$image.png\" > \"/tmp/$image.png\" || true\n if file \"/tmp/$image.png\" | grep 'PNG image'; then\n echo \"VISUAL_${image}_BEGIN\"\n base64 -w 0 \"/tmp/$image.png\"\n echo\n echo \"VISUAL_${image}_END\"\n fi\ndone\ngrep NATIVE_AUDIO_PALETTE_QUEUE_SPEED_DIAGNOSTICS_PASS /tmp/player-result.txt\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n\"$ADB\" emu kill\n"
'on':
  push:
    paths:
    - .github/workflows/phone-native-proof.yml
