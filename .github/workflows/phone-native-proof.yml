    - name: Build test-only x86_64 package and instrumentation
      shell: bash
      run: "cd /tmp/player-proof\nfor attempt in 1 2 3; do if ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2; then break; fi; if [ \"$attempt\" = 3 ]; then exit 1; fi; sleep 20; done\n\npython3 - <<'SWAP'\nimport zipfile,pathlib\np=pathlib.Path('/tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk');q=p.with_name('candidate-unsigned.apk');libs=pathlib.Path('/tmp/vlc-candidate/x86_64')\nwith zipfile.ZipFile(p) as z,zipfile.ZipFile(q,'w',zipfile.ZIP_STORED) as out:\n for name in z.namelist():\n  if name.startswith('META-INF/'):continue\n  part=libs/pathlib.Path(name).name\n  out.writestr(name,part.read_bytes() if name.startswith('lib/x86_64/') and part.is_file() else z.read(name))\nSWAP\nBT=\"$ANDROID_HOME/build-tools/36.0.0\"\n\"$BT/zipalign\" -f -P 16 4 /tmp/player-proof/app/build/outputs/apk/debug/candidate-unsigned.apk /tmp/player-proof/app/build/outputs/apk/debug/candidate-aligned.apk\n\"$BT/apksigner\" sign --ks \"$HOME/.android/debug.keystore\" --ks-pass pass:android --key-pass pass:android --out /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk /tmp/player-proof/app/build/outputs/apk/debug/candidate-aligned.apk\n\"$BT/apksigner\" verify /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk\n"
    - name: Boot accelerated emulator and run actual playback acceptance
      timeout-minutes: 10
      shell: bash
      run: "set -euxo pipefail\ntrap 'tail -160 /tmp/player-live.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -b crash -t 500 || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" shell dumpsys dropbox --print SYSTEM_TOMBSTONE || true; cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk\ndf -h /\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;google_apis_ps16k;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;google_apis_ps16k;x86_64'\necho disk.dataPartition.size=2G >> \"$ANDROID_AVD_HOME/player-proof.avd/config.ini\"\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -memory 4096 -avd player-proof -partition-size 2048 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\ntest \"$(\"$ADB\" shell getconf PAGE_SIZE | tr -d '\\r')\" = 16384\n\"$ADB\" shell settings put global device_provisioned 1\n\"$ADB\" shell settings put secure user_setup_complete 1\n\"$ADB\" shell input keyevent 82\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n\"$ADB\" shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true\n\"$ADB\" logcat -c\n\"$ADB\" logcat -v threadtime > /tmp/player-live.log 2>&1 &\nLOGPID=$!\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n# Fresh install, empty font cache. Exercise canonical asynchronous cold preparation.\nset +e\ntimeout 270 \"$ADB\" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-result.txt\n\"$ADB\" logcat -b crash -d || true\n\"$ADB\" shell dumpsys activity exit-info com.openselena.libreget.runtimeproof || true\n\"$ADB\" logcat -d -s DEBUG:I libc:F AndroidRuntime:E || true\ngrep -E \"OmnigetProof|OmnigetPlayer|libvlc\" /tmp/player-live.log | tail -1000\ngrep -E 'MediaCodec|CCodec|AudioTrack|AndroidRuntime' /tmp/player-live.log | tail -150\nfor image in failure compact-en-dark-port-top compact-en-dark-port-bottom compact-en-dark-land-top compact-en-dark-land-bottom compact-en-light-port-top compact-en-light-port-bottom compact-en-light-land-top compact-en-light-land-bottom compact-ar-dark-port-top compact-ar-dark-port-bottom compact-ar-dark-land-top compact-ar-dark-land-bottom compact-ar-light-port-top compact-ar-light-port-bottom compact-ar-light-land-top compact-ar-light-land-bottom; do\n \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat \"cache/$image.png\" > \"/tmp/$image.png\" || true\n if file \"/tmp/$image.png\" | grep 'PNG image'; then\n echo \"VISUAL_${image}_BEGIN\"\n base64 -w 0 \"/tmp/$image.png\"\n echo\n echo \"VISUAL_${image}_END\"\n fi\ndone\nset -e\ngrep RESPONSIVE_AUDIO_VISUAL_CAPTURE_PASS /tmp/player-result.txt\nkill \"$LOGPID\"\n\"$ADB\" emu kill\n"
'on':
  push:
    branches:
    - phone-integrated-repairs-20261124
    paths:
    - .github/workflows/phone-native-proof.yml
