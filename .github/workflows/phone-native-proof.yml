    - name: Build five source-controlled WebP libraries, both ABIs, no application swap
      run: "set -euo pipefail\nmkdir -p /tmp/webp-controlled\ncd /tmp/webp-controlled\ncurl --fail --location --retry 2 https://github.com/webmproject/libwebp/archive/v1.6.0.tar.gz -o source.tar.gz\necho '93a852c2b3efafee3723efd4636de855b46f9fe1efddd607e1f42f60fc8f2136  source.tar.gz' | sha256sum -c -\ntar -xf source.tar.gz\n\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" 'ndk;27.0.12077973'\ncat > smoke.c <<'CSOURCE'\n#include <stdio.h>\n#include <dlfcn.h>\n#include <stdlib.h>\n#include <string.h>\n#include <stdint.h>\nint main(int argc,char**argv){if(argc!=2)return 1;char path[4096];const char*names[]={\"libsharpyuv.so\",\"libwebp.so\",\"libwebpdecoder.so\",\"libwebpdemux.so\",\"libwebpmux.so\"};void*lib=0;for(int i=0;i<5;i++){snprintf(path,sizeof(path),\"%s/%s\",argv[1],names[i]);void*h=dlopen(path,RTLD_NOW|RTLD_GLOBAL);if(!h){fprintf(stderr,\"dlopen failed %s: %s\\n\",names[i],dlerror());return 2;}if(i==1)lib=h;}typedef size_t(*enc_t)(const uint8_t*,int,int,int,uint8_t**);typedef uint8_t*(*dec_t)(const uint8_t*,size_t,int*,int*);typedef void(*free_t)(void*);enc_t enc=(enc_t)dlsym(lib,\"WebPEncodeLosslessRGBA\");dec_t dec=(dec_t)dlsym(lib,\"WebPDecodeRGBA\");free_t release=(free_t)dlsym(lib,\"WebPFree\");if(!enc||!dec||!release)return 3;uint8_t px[]={255,0,0,255,0,255,0,255,0,0,255,255,255,255,255,255};uint8_t*out=0;size_t size=enc(px,2,2,8,&out);if(!size)return 4;int w=0,h=0;uint8_t*decoded=dec(out,size,&w,&h);if(!decoded||w!=2||h!=2||memcmp(px,decoded,16))return 5;release(out);release(decoded);puts(\"WEBP_FIVE_LIB_LOAD_LOSSLESS_ROUNDTRIP_PASS\");return 0;}\nCSOURCE\nfor spec in aarch64-linux-android24:arm64-v8a x86_64-linux-android24:x86_64; do\n target=${spec%:*}; abi=${spec#*:}\n cmake -S libwebp-1.6.0 -B \"build-$abi\" -DCMAKE_TOOLCHAIN_FILE=\"$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake\" -DANDROID_ABI=\"$abi\" -DANDROID_PLATFORM=24 -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWEBP_LINK_STATIC=OFF -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF -DWEBP_ENABLE_SWAP_16BIT_CSP=ON -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384'\n cmake --build \"build-$abi\" -j2\n \"$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/$target-clang\" -fPIE -pie -Wl,-z,max-page-size=16384 smoke.c -ldl -o \"build-$abi/webp-smoke\"\n for library in \"build-$abi\"/lib*.so; do readelf -l \"$library\";readelf -d \"$library\";done\ndone\n"
    - name: Boot accelerated emulator and run actual playback acceptance
      timeout-minutes: 10
      shell: bash
      run: "set -euxo pipefail\ntrap 'cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk\ndf -h /\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;default;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;default;x86_64'\necho disk.dataPartition.size=2G >> \"$ANDROID_AVD_HOME/player-proof.avd/config.ini\"\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -avd player-proof -partition-size 2048 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\n\"$ADB\" shell settings put global device_provisioned 1\n\"$ADB\" shell settings put secure user_setup_complete 1\n\"$ADB\" shell input keyevent 82\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n\"$ADB\" push /tmp/webp-controlled/build-x86_64 /data/local/tmp/webp-controlled\n\"$ADB\" shell chmod 755 /data/local/tmp/webp-controlled/webp-smoke\n\"$ADB\" shell 'LD_LIBRARY_PATH=/data/local/tmp/webp-controlled /data/local/tmp/webp-controlled/webp-smoke /data/local/tmp/webp-controlled'\n\"$ADB\" logcat -c\n\"$ADB\" logcat -v threadtime > /tmp/player-live.log 2>&1 &\nLOGPID=$!\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n# Fresh install, empty font cache. Exercise canonical asynchronous cold preparation.\nset +e\ntimeout 270 \"$ADB\" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-result.txt\ngrep -E \"OmnigetProof|OmnigetPlayer|libvlc\" /tmp/player-live.log | tail -1000\ngrep -E 'MediaCodec|CCodec|AudioTrack|AndroidRuntime' /tmp/player-live.log | tail -150\nfor image in arabic-subtitle queue-sheet queue-drag queue-settled audio-light audio-dark options-light options-dark options-bottom-light options-bottom-dark favorite-light favorite-dark unfavorite-light unfavorite-dark failure; do\n \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat \"cache/$image.png\" > \"/tmp/$image.png\" || true\n if file \"/tmp/$image.png\" | grep 'PNG image'; then\n echo \"VISUAL_${image}_BEGIN\"\n base64 -w 0 \"/tmp/$image.png\"\n echo\n echo \"VISUAL_${image}_END\"\n fi\ndone\nset -e\ngrep NATIVE_AUDIO_PALETTE_QUEUE_SPEED_DIAGNOSTICS_PASS /tmp/player-result.txt\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof.test\n# New process retains only generated font cache. Require displayed video again.\ntimeout 270 \"$ADB\" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-warm-result.txt\ngrep NATIVE_AUDIO_PALETTE_QUEUE_SPEED_DIAGNOSTICS_PASS /tmp/player-warm-result.txt\ngrep -E \"OmnigetProof|OmnigetPlayer\" /tmp/player-live.log | tail -120\nkill \"$LOGPID\"\n\"$ADB\" emu kill\n"
    - name: Preserve WebP candidates and their complete small source
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: controlled-webp-16k-candidates-no-app-swap
        path: /tmp/webp-controlled
        retention-days: 14
        if-no-files-found: error
'on':
  push:
    paths:
    - .github/workflows/phone-native-proof.yml
