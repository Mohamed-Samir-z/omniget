name: Apply clip metadata lint repair
on:
  push:
    branches: [android-build10]
    paths: [.github/workflows/fix-build10.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build10
      - name: Apply reviewed source-only fix
        env:
          DELTA: 
        run: |
          python3 -c 'import os,base64,pathlib;pathlib.Path("/tmp/fix.patch").write_bytes(base64.b64decode(os.environ["DELTA"]))'
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/fix-build10.yml
          git add src-tauri/src/core/queue.rs .github/workflows/fix-build10.yml
          git commit -m 'Fix clip metadata Option short-circuit without new lint warnings'
          git push origin HEAD:android-build10
