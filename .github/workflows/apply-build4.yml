name: Apply reviewed Build 4 sources
on:
  push:
    branches: [android-speed-mp3-schedule]
    paths: [.github/workflows/apply-build4.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-speed-mp3-schedule
      - name: Apply exact source delta
        env:
          PATCH_ZLIB: 
          PATCH_SHA256: 369a3e5bd1ca73d8b0b1f370515112c4c4b7440d8aaaba22bb60691758024e55
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB']))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build4.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build4.patch
          git apply /tmp/build4.patch
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri src .github/android
          git commit -m 'Android: speed notifications, MP3 per download, scheduled sharing'
          git push origin HEAD:android-speed-mp3-schedule
