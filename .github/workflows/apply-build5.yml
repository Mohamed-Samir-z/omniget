name: Apply reviewed Build 5 sources
on:
  push:
    branches: [android-source-popup]
    paths: [.github/workflows/apply-build5.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-source-popup
      - name: Apply exact source delta
        env:
          PATCH_ZLIB: 
          PATCH_SHA256: 00a508d43c281715600d3476753ea0bde3fca59ec0f860668382528228319e9d
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB']))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build5.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build5.patch
          git apply /tmp/build5.patch
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri src .github/android
          git commit -m 'Android: native source-app share popup and explicit full-app prefill'
          git push origin HEAD:android-source-popup
