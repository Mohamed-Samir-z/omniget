name: Combined Player unsigned validation build
on:
  push:
    branches: [build/owner-completion-reviewed-20261123]
permissions:
  contents: read
concurrency:
  group: reviewed-unsigned-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # arm64 covers virtually every phone made in the last decade and keeps
      # the build fast. Add armv7 / x86_64 here if you need them.
      ANDROID_TARGET: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Apply reviewed application-only source patch
        run: |
          cat reviewed-source-*.b64 | base64 --decode | gzip --decompress > reviewed-app.patch
          echo "08de8d904df9b5e58c063de5e47c93685284305e655cf01eae8289bd387a9d0e  reviewed-app.patch" | sha256sum --check
          git apply --check reviewed-app.patch
          git apply reviewed-app.patch
      - name: Apply bounded background APK discovery
        run: |
          python3 - <<'PY_BACKGROUND'
          import base64, gzip, hashlib
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '69229eeb77f190ae4c00e19e73b78ca16f8f9d8c4178542c851c76ee5e51689c'
          Path('/tmp/background-apk.patch').write_bytes(patch)
          PY_BACKGROUND
          git apply --check /tmp/background-apk.patch
          git apply /tmp/background-apk.patch
      - name: Apply bounded exact-device review lifetime correction
        run: |
          python3 - <<'PY_CLOCK'
          import base64, gzip, hashlib
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == 'dfbb16a1b6cecbff720580a6f9a8b27db8bb323ffc7b0aa93f5300c63c1a4b89'
          Path('/tmp/review-clock.patch').write_bytes(patch)
          PY_CLOCK
          git apply --check /tmp/review-clock.patch
          git apply /tmp/review-clock.patch
      - name: Apply combined Player and final controls source snapshot
