name: Installed real download and sanitized diagnostic restart acceptance
permissions:
  actions: read
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Wait for exact full packaged build, never download a different run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run watch 45372889880 --repo Mohamed-Samir-z/omniget --exit-status --interval 60
    - name: Download existing test-only combined build
      uses: actions/download-artifact@v4
      with:
        name: omniget-packaged-x86_64-unsigned
        path: /tmp/combined
        run-id: 45372889880
        github-token: ${{ github.token }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Materialize external nonsecret instrumentation
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        mkdir -p /tmp/installed-proof

        cd /tmp/installed-proof

        python3 - <<''PY''

        import io,tarfile,base64,lzma

        tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode('''')))).extractall(''.'')

        PY

        ffmpeg -hide_banner -loglevel error -y -f lavfi -i ''testsrc2=size=240x426:rate=12'' -f lavfi -i ''sine=frequency=440:sample_rate=22050'' -t 120 -c:v libx264 -preset ultrafast -crf 40 -c:a aac -b:a 16k app/src/main/assets/acceptance-portrait.mp4

        chmod +x gradlew

        ./gradlew :app:assembleDebug --no-daemon --max-workers=2'
    - name: Install exact full build with test-only signature and run actual-origin checks
      run: "set -euxo pipefail\ntrap 'cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;google_apis;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;google_apis;x86_64'\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -avd player-proof -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\n\"$ADB\" shell input keyevent 82\nBT=\"$ANDROID_HOME/build-tools/35.0.0\"\ntest -x \"$BT/apksigner\" || \"$SDKMANAGER\" 'build-tools;35.0.0'\nkeytool -genkeypair -keystore /tmp/test-signing.jks -storepass android -keypass android -alias androiddebugkey -dname CN=TEST-ONLY -keyalg RSA -validity 2\n\"$BT/zipalign\" -f -P 16 4 /tmp/combined/omniget-packaged-x86_64-unsigned.apk /tmp/combined/aligned.apk\n\"$BT/apksigner\" sign --ks /tmp/test-signing.jks --ks-pass pass:android --key-pass pass:android --out /tmp/combined/installed-test-only.apk /tmp/combined/aligned.apk\n\"$BT/apksigner\" sign --ks /tmp/test-signing.jks --ks-pass pass:android --key-pass pass:android /tmp/installed-proof/app/build/outputs/apk/debug/app-debug.apk\n\"$ADB\" install /tmp/combined/installed-test-only.apk\n\"$ADB\" install /tmp/installed-proof/app/build/outputs/apk/debug/app-debug.apk\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.READ_MEDIA_VIDEO\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.READ_MEDIA_AUDIO\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.POST_NOTIFICATIONS\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.READ_MEDIA_IMAGES\n\"$ADB\" shell am force-stop com.google.android.apps.nexuslauncher\n\"$ADB\" logcat -c\nset +e\ntimeout 240 \"$ADB\" shell am instrument -w -e phase first com.omniget.proof/com.omniget.proof.InstalledProof | tee /tmp/installed-result-first.txt\n\"$ADB\" shell am force-stop com.openselena.libreget\ntimeout 180 \"$ADB\" shell am instrument -w -e phase second com.omniget.proof/com.omniget.proof.InstalledProof | tee /tmp/installed-result-second.txt\nfor name in installed-actual-download-complete installed-log-before-restart installed-log-after-restart installed-completed-play installed-failure; do\n \"$ADB\" pull \"/sdcard/Android/data/com.openselena.libreget/files/$name.png\" \"/tmp/$name.png\" || true\n if test -s \"/tmp/$name.png\"; then echo \"VISUAL_${name}_BEGIN\";base64 -w 0 \"/tmp/$name.png\";echo;echo \"VISUAL_${name}_END\";fi\ndone\n\"$ADB\" logcat -d -s AndroidRuntime:E RustStdoutStderr:V chromium:E | tail -100\nset -e\ngrep INSTALLED_DOWNLOAD_LOG_FIRST_PASS /tmp/installed-result-first.txt\ngrep INSTALLED_DOWNLOAD_LOG_SECOND_PASS /tmp/installed-result-second.txt\n\"$ADB\" emu kill\n"
'on':
  push:
    branches:
    - phone-integrated-repairs-20261124
    paths:
    - .github/workflows/phone-installed-acceptance.yml
