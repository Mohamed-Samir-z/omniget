name: Route verified Android APK to requested channel
on:
  push:
    branches: [android-build12-channel-promotion]
    paths: [.github/workflows/promote-build12-channel.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: android-build12-channel-promotion
  cancel-in-progress: false
jobs:
  route-exact-apk:
    if: github.repository == 'Mohamed-Samir-z/omniget' && github.ref == 'refs/heads/android-build12-channel-promotion' && github.run_number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve Build12 test route and route only the verified current APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > route.py <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, time, urllib.request, zipfile
          R = 'repos/Mohamed-Samir-z/omniget'
          OLD_SHA = '3fe8d4b25410e27c616dfa2400b8bc6389090198cb4023af0d6790bfa3e1f76b'
          NEW_SHA = 'dad34cee99b6820ed7d1c3c663deabe9c3cf21f2aa687af92203632ae40c6e90'
          ZIP_SHA = '48fd857f10fe094e5719b803a394517cef8b7bfcb72ffbfd4ed183c473979129'
          SOURCE = '10d4c2847b0273613c184aa2dd705ff40c617f77'
          BUILD = 'dde38615048e591560346fb301464db0650e1307'
          OLD_SOURCE = '3471aa60867bade299abed5bda761965638e7608'
          TAG = 'android-feature-round-12-test'
          NAME = 'libreget-android.apk'
          STAGE = 'libreget-android-candidate-dad34cee.apk'
          BACKUP = 'libreget-android-build12-3fe8d4b2.apk'
          OLD_ID = 779002472
          BASE_ID = 774322444
          BASE_SHA = '3695993ad908169b94a6643cb62d550ca41ca06f7c904029b6b1ec77ee4f42c4'
          ROOT = pathlib.Path('evidence'); ROOT.mkdir(exist_ok=True)
          DATA = pathlib.Path('downloads'); DATA.mkdir(exist_ok=True)
          assert os.environ['GITHUB_REPOSITORY'] == 'Mohamed-Samir-z/omniget'
          assert os.environ['GITHUB_REF'] == 'refs/heads/android-build12-channel-promotion'
          assert int(os.environ['GITHUB_RUN_NUMBER']) == 2
          DEADLINE = time.monotonic() + 510
          
          def save(name, value):
              (ROOT / name).write_text(json.dumps(value, indent=2))
          
          def api(path, method='GET', data=None):
              assert time.monotonic() < DEADLINE - 15, 'Stop before deadline'
              args = ['gh','api',path,'--method',method,'-H','Cache-Control: no-cache']
              if data is not None: args += ['--input','-']
              out = subprocess.check_output(args, input=None if data is None else json.dumps(data).encode(), timeout=45)
              return json.loads(out) if out.strip() else None
          
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          
          def download(url, path, sha, size):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'omniget-authorized-channel-routing','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=60) as res, path.open('wb') as out:
                          while block := res.read(1024*1024): out.write(block)
                      assert path.stat().st_size == size and digest(path) == sha, 'Downloaded binary identity mismatch'
                      return {'url':url,'sha256':sha,'bytes':size}
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2**attempt)
          
          def rel():
              value = api(R+'/releases/tags/android-latest')
              assert value['id'] == 453014803 and value['prerelease'] is True and value['draft'] is False
              return value
          
          def asset(value,name):
              rows = [a for a in value['assets'] if a['name']==name]
              assert len(rows)<=1
              return rows[0] if rows else None
          
          def valid(a,sha,size,ident=None):
              assert a and a['state']=='uploaded' and a['digest']=='sha256:'+sha and a['size']==size
              if ident is not None: assert a['id']==ident
          
          def refs():
              return {k:api(R+'/git/ref/'+k)['object']['sha'] for k in ['tags/android-latest','heads/android','heads/main']}
          
          def upload(tag,path):
              subprocess.run(['gh','release','upload',tag,str(path)],check=True,timeout=100)
          
          def rename(ident,name):
              before=api(R+'/releases/assets/'+str(ident))
              if before['name']!=name:
                  try: api(R+'/releases/assets/'+str(ident),'PATCH',{'name':name})
                  except Exception: print('Asset rename reply uncertain; reconciling exact object')
              after=api(R+'/releases/assets/'+str(ident));assert after['name']==name
              return after
          
          # A successful invocation spends this exact one-shot routing grant.
          for attempt in range(1,int(os.environ['GITHUB_RUN_ATTEMPT'])):
              past=api(R+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+str(attempt))
              if past['conclusion']=='success':
                  print('Earlier attempt succeeded; this rerun is read-only.')
                  raise SystemExit(0)
          
          entry=rel(); save('release-before.json',entry)
          original_refs=refs();save('refs-before.json',original_refs)
          valid(asset(entry,'libreget-android-before-build12-3695993a.apk'),BASE_SHA,100816240,BASE_ID)
          current=asset(entry,NAME)
          if current and current.get('digest')=='sha256:'+NEW_SHA:
              assert BUILD in entry['body'] or entry['target_commitish']==BUILD
              save('outcome.json',{'state':'already-routed','release':entry['html_url'],'apk':current['browser_download_url']})
              print('Exact new APK is already canonical; no further mutations.')
              raise SystemExit(0)
          valid(current,OLD_SHA,100939922,OLD_ID)
          assert entry['name']=='omniget Android, Build12 TEST'
          assert entry['target_commitish']=='fa0051a45d4876d05c4c44ca885af5114e8dab18'
          oldbody=entry['body']; assert OLD_SHA in oldbody and OLD_SOURCE in oldbody and '45018184508' in oldbody
          # Preserve every existing sentence/caveat. Only provenance field values change.
          body=oldbody.replace(OLD_SHA,NEW_SHA).replace(OLD_SOURCE,SOURCE).replace('45018184508','45039285959 ('+BUILD+')')
          assert body!=oldbody
          newtitle=entry['name'].replace('Build12 ','')
          
          run=api(R+'/actions/runs/45039285959')
          assert run['conclusion']=='success' and run['status']=='completed' and run['head_sha']==BUILD
          art=api(R+'/actions/artifacts/14761920259')
          assert art['workflow_run']['id']==45039285959 and not art['expired']
          assert art['name']=='omniget-final-candidate-10d4c28' and art['digest']=='sha256:'+ZIP_SHA
          save('source-artifact.json',art)
          subprocess.run(['gh','run','download','45039285959','--name',art['name'],'--dir','candidate'],check=True,timeout=100)
          new=pathlib.Path('candidate')/NAME
          assert new.stat().st_size==101480651 and digest(new)==NEW_SHA
          manifest=json.loads((pathlib.Path('candidate')/'build-manifest.json').read_text())
          save('candidate-manifest.json',manifest)
          old=DATA/NAME
          download(current['browser_download_url'],old,OLD_SHA,100939922)
          
          # Preserve the exact previous updater APK in its own non-production test route first.
          try:
              archive=api(R+'/releases/tags/'+TAG)
          except subprocess.CalledProcessError as e:
              # Distinguish a genuinely absent tag from access/transient errors before writing.
              check=subprocess.run(['gh','api',R+'/releases/tags/'+TAG,'--include'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              assert b'404' in check.stdout+check.stderr
              archive=api(R+'/releases','POST',{'tag_name':TAG,'target_commitish':OLD_SOURCE,'name':entry['name'],'body':oldbody,'draft':False,'prerelease':True,'make_latest':'false'})
          assert archive['tag_name']==TAG and archive['prerelease'] is True and archive['draft'] is False
          assert archive['name']==entry['name'] and archive['body']==oldbody
          arch=asset(archive,NAME)
          if arch is None:
              upload(TAG,old)
              archive=api(R+'/releases/tags/'+TAG);arch=asset(archive,NAME)
          valid(arch,OLD_SHA,100939922)
          archive_proof=download(arch['browser_download_url'],DATA/'build12-test-readback.apk',OLD_SHA,100939922)
          save('old-test-route-verified.json',archive_proof|{'release':archive['html_url'],'asset_id':arch['id']})
          
          # Stage and independently read back the new file before changing the canonical name.
          value=rel(); valid(asset(value,NAME),OLD_SHA,100939922,OLD_ID)
          assert value['body']==oldbody and value['name']==entry['name'] and refs()==original_refs
          staged=asset(value,STAGE)
          if staged is None:
              staged_path=new.with_name(STAGE);new.rename(staged_path);upload('android-latest',staged_path)
          value=rel();staged=asset(value,STAGE);valid(staged,NEW_SHA,101480651)
          assert staged['id']!=OLD_ID and staged['created_at']>'2026-11-22T15:38:32Z'
          download(staged['browser_download_url'],DATA/'new-staged-readback.apk',NEW_SHA,101480651)
          value=rel();valid(asset(value,NAME),OLD_SHA,100939922,OLD_ID)
          valid(asset(value,STAGE),NEW_SHA,101480651,staged['id'])
          assert asset(value,BACKUP) is None and refs()==original_refs
          assert value['body']==oldbody and value['name']==entry['name']
          save('before-switch.json',value)
          # Two renames are separate operations. Retain the old object for rollback and test access.
          renamed=False
          try:
              rename(OLD_ID,BACKUP);renamed=True
              rename(staged['id'],NAME)
              # Mechanical field-value updates, no new release-note narrative and no stable label.
              api(R+'/releases/453014803','PATCH',{'name':newtitle,'body':body,'target_commitish':BUILD,'draft':False,'prerelease':True,'make_latest':'false'})
              value=rel();candidate=asset(value,NAME)
              valid(candidate,NEW_SHA,101480651,staged['id'])
              valid(asset(value,BACKUP),OLD_SHA,100939922,OLD_ID)
              valid(asset(value,'libreget-android-before-build12-3695993a.apk'),BASE_SHA,100816240,BASE_ID)
              assert value['body']==body and value['name']==newtitle
              assert BUILD in value['body'] or value['target_commitish']==BUILD
              assert refs()==original_refs
              proof=download(candidate['browser_download_url'],DATA/'canonical-readback.apk',NEW_SHA,101480651)
              # The older Build12 object now has a separately verified permanent test route.
              # Remove only its additional backup from the updater release, never any unrelated archive.
              api(R+'/releases/assets/'+str(OLD_ID),'DELETE')
              after=rel();valid(asset(after,NAME),NEW_SHA,101480651,staged['id'])
              assert asset(after,BACKUP) is None and refs()==original_refs
              valid(asset(after,'libreget-android-before-build12-3695993a.apk'),BASE_SHA,100816240,BASE_ID)
              archive=api(R+'/releases/tags/'+TAG);valid(asset(archive,NAME),OLD_SHA,100939922,arch['id'])
              result={'state':'exact-new-apk-canonical-and-old-in-test-route','release':after['html_url'],'canonical':proof,'new_asset_id':staged['id'],'old_test_release':archive['html_url'],'old_test_apk':arch['browser_download_url'],'old_test_sha256':OLD_SHA,'same_build_recognition':BUILD in after['body'] or after['target_commitish']==BUILD,'source_snapshot':SOURCE,'build_identity':BUILD,'unchanged_refs':original_refs,'physical_device_verified':False,'version_name':'0.16.6','version_code':16006,'equal_version_code_to_build12':True,'full_16k_runtime_compatibility':False}
              save('release-after.json',after);save('outcome.json',result);print(json.dumps(result))
          except Exception:
              # Never blindly overwrite an uncertain canonical state. Restore only exact known objects.
              state=rel();save('failure-release-state.json',state)
              active=asset(state,NAME)
              if active is None and renamed:
                  valid(asset(state,BACKUP),OLD_SHA,100939922,OLD_ID)
                  rename(OLD_ID,NAME)
              raise
          finally:
              if (ROOT/'outcome.json').exists():
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                      out.write('## Exact APK routing verification\n\n```json\n'+(ROOT/'outcome.json').read_text()+'\n```\n')
          PYTHON
          python3 route.py
      - name: Retain exact routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-apk-routing-verification
          path: evidence/
          if-no-files-found: error
          retention-days: 3
