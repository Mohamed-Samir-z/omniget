name: Preserve a tested build

# Copies the current `android-latest` APK into a permanent release so a build
# the owner has tested is not lost when the next CI run replaces it.
# Triggered by editing .github/android/preserve-request.json.
on:
  push:
    branches: [android]
    paths: ['.github/android/preserve-request.json']

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(jq -r .tag .github/android/preserve-request.json)
          SHA=$(jq -r .sha .github/android/preserve-request.json)
          EXPECT=$(jq -r .expect .github/android/preserve-request.json)
          TITLE=$(jq -r .title .github/android/preserve-request.json)
          NAME=$(gh release view android-latest --json name -q .name)
          echo "android-latest is: $NAME"
          test "$NAME" = "$EXPECT" || { echo "android-latest is not the expected build"; exit 1; }
          gh release download android-latest -p libreget-android.apk
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" libreget-android.apk --target "$SHA" \
            --title "$TITLE" --notes-file .github/android/preserve-notes.md
