name: Android isolated media candidate

on:
  push:
    branches: [android-next-artifact-20261122]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # test artifact only; no release or tag writes

