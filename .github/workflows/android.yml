6)t^tL=KO`RsYcni{oWY`EEG9xGpp9d*yk+%q!1nVQ6`bC<C}*HTaZd_GW9sFls5ozqO{IB3DGkpwp7Dx~S|Oajz+BMXGXfFJVcZZ(TCbhx~ABnuNYrmv>0Rdl2mHh01#7WgA)g12J~7-7PJHKd!1(fj1iP>MOF_GRos-^2QnFwiaX$h_-IuKfvd!?~Vrv%|?TPvPagSzOg0H;pwg8>k)H+))D4B`IR}0<W1dLn=|83QdVr~{7<OzqL)5A*8&6-lH>qN{Wdr5MUm8>G-*;Z9j;Mc)sXdJPKMTDpBNmDw5dRLW7zuQSW-hH9ecQs11~+gM;=7u?}-BW+=d)s@f|aCW_3mB$NoJB8bs7fRXv_F`y+D{YemDJN8`F;BSP0XDAMU%WA_}J!uZe4EUC){F|kJw*(_MU3C?BQup0m6hdb-I*YX6wz93uZ!Y_+<I4!vg!@jU%NOE!5Q@gJ#p$I38000005PI54=sIG@00Gta3&y5MGHT1YvBYQl0ssI200dcD'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$OMNIGET_PATCH_BASE"
          git diff --exit-code "$OMNIGET_PATCH_BASE" HEAD -- . ':!.github/workflows/android.yml'
          python3 - <<'PYCODE'
          import os,base64,lzma,hashlib,pathlib
          data=lzma.decompress(base64.b85decode("".join(os.environ["OMNIGET_SOURCE_PATCH_"+str(i)] for i in range(3))))
          assert hashlib.sha256(data).hexdigest() == os.environ["OMNIGET_SOURCE_PATCH_SHA256"]
          pathlib.Path('/tmp/omniget-next-version.patch').write_bytes(data)
          PYCODE
          git apply --unidiff-zero --check /tmp/omniget-next-version.patch
          git apply --unidiff-zero /tmp/omniget-next-version.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and build tools
        # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME),
        # so we only add the pieces we need with its own sdkmanager.
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

          # NDK r23+ dropped the `<triple>-ranlib` / `-ar` binutils names and
          # ships only llvm-* tools. The vendored OpenSSL build still looks for
          # the old names, so expose them as symlinks on PATH.
          NDKBIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHIMS="$HOME/ndk-shims"
          mkdir -p "$SHIMS"
          for triple in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do
            for tool in ar ranlib strip nm; do
              ln -sf "$NDKBIN/llvm-$tool" "$SHIMS/$triple-$tool"
            done
          done
          echo "$SHIMS" >> "$GITHUB_PATH"
          echo "$NDKBIN" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend and source formatting
        run: |
          pnpm check
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Generate the Android project
        run: pnpm tauri android init --ci

      - name: Resolve buildSrc plugin dependencies from Maven Central first
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          
          root = Path('src-tauri/gen/android/buildSrc')
          if not root.is_dir():
              raise SystemExit('Generated Android buildSrc is missing')
          settings = root / 'settings.gradle.kts'
          existing = settings.read_text() if settings.exists() else ''
          marker = '// omniget: resolve Kotlin plugin dependencies directly from Maven Central first'
          if marker in existing:
              print('buildSrc plugin dependency routing already configured')
          elif re.search(r'\bpluginManagement\s*\{', existing):
              raise SystemExit('Unexpected existing buildSrc pluginManagement; inspect before modifying')
          else:
              settings.write_text(marker + '\npluginManagement {\n    repositories {\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\n' + existing)
              print('buildSrc plugin dependencies: Maven Central first, Gradle Plugin Portal retained')
          PYCODE

      - name: Test Android runtime patcher
        run: |
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_download_startup.py

      - name: Bundle yt-dlp, Python and ffmpeg
        run: |
          python3 .github/android/patch_project.py
          python3 .github/android/test_download_startup.py --yt-dlp src-tauri/gen/android/app/src/main/res/raw/omniget_ytdlp

      - name: Test gallery registration and filenames
        run: |
          python3 .github/android/test_gallery_registration.py
          rustc --edition 2021 --test .github/android/media_names.rs -o /tmp/media-names-test
          /tmp/media-names-test

      - name: Build release APK
        run: |
          # Stamp the build so the in-app updater can tell whether the
          # android-latest release is newer than the installed APK.
          export LIBREGET_BUILD_SHA="$GITHUB_SHA"
          export LIBREGET_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm tauri android build --apk --target "$ANDROID_TARGET" --ci

      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          KEYSTORE="$RUNNER_TEMP/omniget-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          UNSIGNED="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n 1)"
          test -n "$UNSIGNED" || { echo "no unsigned APK found"; exit 1; }
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" dist/aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/libreget-android.apk dist/aligned.apk
          "$BT/apksigner" verify --verbose dist/libreget-android.apk
          rm dist/aligned.apk

      - name: Inspect the signed APK and save provenance
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          {
            echo "== size / sha256 =="; ls -l dist/libreget-android.apk; sha256sum dist/libreget-android.apk
            echo "== zip integrity =="; unzip -tq dist/libreget-android.apk
            echo "== zipalign check =="; "$BT/zipalign" -c -P 16 -v 4 dist/libreget-android.apk
            echo "== signatures =="; "$BT/apksigner" verify --verbose --print-certs dist/libreget-android.apk
            echo "== manifest summary =="; "$BT/aapt2" dump badging dist/libreget-android.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:)"
          } | tee dist/apk-verification.txt
          python3 - <<'PYCODE'
          import os,pathlib,hashlib,json
          apk=pathlib.Path('dist/libreget-android.apk')
          manifest={"channel":"isolated-test-artifact","promoted":False,"app_snapshot_commit":os.environ["OMNIGET_APP_SOURCE_COMMIT"],"app_patch_base":os.environ["OMNIGET_PATCH_BASE"],"source_patch_sha256":os.environ["OMNIGET_SOURCE_PATCH_SHA256"],"gradle_repository_routing":"buildSrc pluginManagement uses Maven Central before Gradle Plugin Portal","workflow_checkout_commit":os.environ["GITHUB_SHA"],"apk_build_stamp_commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"apk_bytes":apk.stat().st_size,"apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),"remaining_scope":["guide and later localization work","Android-device behavior verification","independent artifact retrieval and local inspection"]}
          pathlib.Path('dist/build-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PYCODE

      - uses: actions/upload-artifact@v4
        with:
          name: omniget-media-candidate-a790f36
          path: |
