name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Replace android-latest only after the APK is approved"
        type: boolean
        required: false
        default: false
  push:
    branches: [android]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # arm64 covers virtually every phone made in the last decade and keeps
      # the build fast. Add armv7 / x86_64 here if you need them.
      ANDROID_TARGET: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and build tools
        # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME),
        # so we only add the pieces we need with its own sdkmanager.
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

          # NDK r23+ dropped the `<triple>-ranlib` / `-ar` binutils names and
          # ships only llvm-* tools. The vendored OpenSSL build still looks for
          # the old names, so expose them as symlinks on PATH.
          NDKBIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SHIMS="$HOME/ndk-shims"
          mkdir -p "$SHIMS"
          for triple in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do
            for tool in ar ranlib strip nm; do
              ln -sf "$NDKBIN/llvm-$tool" "$SHIMS/$triple-$tool"
            done
          done
          echo "$SHIMS" >> "$GITHUB_PATH"
          echo "$NDKBIN" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm tauri android init --ci

      - name: Test Android runtime patcher
        run: |
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_download_startup.py

      - name: Bundle yt-dlp, Python and ffmpeg
        run: |
          python3 .github/android/patch_project.py
          python3 .github/android/test_download_startup.py --yt-dlp src-tauri/gen/android/app/src/main/res/raw/omniget_ytdlp

      - name: Test gallery registration and filenames
        run: |
          python3 .github/android/test_gallery_registration.py
          rustc --edition 2021 --test .github/android/media_names.rs -o /tmp/media-names-test
          /tmp/media-names-test

      - name: Build release APK
        run: pnpm tauri android build --apk --target "$ANDROID_TARGET" --ci

      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          KEYSTORE="$RUNNER_TEMP/omniget-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          UNSIGNED="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n 1)"
          test -n "$UNSIGNED" || { echo "no unsigned APK found"; exit 1; }
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" dist/aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/libreget-android.apk dist/aligned.apk
          "$BT/apksigner" verify --verbose dist/libreget-android.apk
          rm dist/aligned.apk

      - name: Inspect the signed APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          echo "== size / sha256 =="; ls -l dist/libreget-android.apk; sha256sum dist/libreget-android.apk
          echo "== zip integrity =="; unzip -tq dist/libreget-android.apk | tail -n 1
          echo "== zipalign check =="; "$BT/zipalign" -c -P 16 -v 4 dist/libreget-android.apk | tail -n 3 || true
          echo "== signatures =="; "$BT/apksigner" verify --verbose --print-certs dist/libreget-android.apk | head -n 20
          echo "== manifest summary =="; "$BT/aapt2" dump badging dist/libreget-android.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label:)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: libreget-android-apk
          path: dist/libreget-android.apk
          if-no-files-found: error

      # A Release gives a plain, direct .apk link that works from a phone
      # browser (workflow artifacts are zipped and their links expire).
      - name: Publish APK to a GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/libreget-android.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android build ${GITHUB_SHA::7}" \
            --notes "Debug-quality Android build of commit $GITHUB_SHA. Download libreget-android.apk and install it."
