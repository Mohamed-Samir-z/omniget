name: Apply Android mobile and recovery repairs
on:
  push:
    branches: [android-build10]
    paths: [.github/workflows/apply-build10.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build10
      - name: Apply source delta
        env:
          PATCH_PART_0: 
          PATCH_PART_1: 
          PATCH_SHA256: abba88cdd99795e2b074dc4eb09afb00e969c7fc90524fb5f7353a33abdfe100
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(''.join(os.environ['PATCH_PART_%d' % i] for i in range(2))))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/source.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-build10.yml
          git add src src-tauri .github/android .github/workflows
          git commit -m 'Android: mobile repair, warm share continuity and durable clip recovery'
          git push origin HEAD:android-build10
