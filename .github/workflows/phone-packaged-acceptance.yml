xt());data.update(labels);p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n')\nPLAYERLABELS\n"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install NDK and build tools
      run: "SDKM=\"$(ls -d \"$ANDROID_HOME\"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)\"\nyes | \"$SDKM\" --licenses >/dev/null || true\n\"$SDKM\" \"platforms;android-34\" \"build-tools;34.0.0\" \"ndk;27.0.12077973\"\necho \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973\" >> \"$GITHUB_ENV\"\necho \"NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973\" >> \"$GITHUB_ENV\"\n\n# NDK r23+ dropped the `<triple>-ranlib` / `-ar` binutils names and\n# ships only llvm-* tools. The vendored OpenSSL build still looks for\n# the old names, so expose them as symlinks on PATH.\nNDKBIN=\"$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin\"\nSHIMS=\"$HOME/ndk-shims\"\nmkdir -p \"$SHIMS\"\nfor triple in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do\n  for tool in ar ranlib strip nm; do\n    ln -sf \"$NDKBIN/llvm-$tool\" \"$SHIMS/$triple-$tool\"\n  done\ndone\necho \"$SHIMS\" >> \"$GITHUB_PATH\"\necho \"$NDKBIN\" >> \"$GITHUB_PATH\"\n"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ./src-tauri
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
    - name: Generate the Android project
      run: pnpm tauri android init --ci
    - name: Test Android runtime patcher
      run: 'python3 .github/android/test_android_dependency_scope.py

        python3 .github/android/test_patch_project.py

        python3 .github/android/test_resume_policy.py

        python3 .github/android/test_download_startup.py

        '
    - name: Bundle yt-dlp, Python and ffmpeg
      run: 'python3 .github/android/patch_project.py

        python3 .github/android/test_download_startup.py --yt-dlp src-tauri/gen/android/app/src/main/res/raw/omniget_ytdlp

        '
    - name: Test gallery registration and filenames
      run: 'python3 .github/android/test_gallery_registration.py

        rustc --edition 2021 --test .github/android/media_names.rs -o /tmp/media-names-test

        /tmp/media-names-test

        '
    - name: Build release APK
      run: '# Stamp the build so the in-app updater can tell whether the

        # android-latest release is newer than the installed APK.

        export LIBREGET_BUILD_SHA="$GITHUB_SHA"

        export LIBREGET_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        pnpm tauri android build --apk --target "$ANDROID_TARGET" --ci

        '
    - name: Collect full unsigned x86_64 application, not release promotion
      run: 'mkdir -p dist

        find src-tauri/gen/android -name ''*.apk'' -type f -print

        APK="$(find src-tauri/gen/android/app/build/outputs -name ''*.apk'' -type f | head -1)"

        test -n "$APK"

        cp "$APK" dist/omniget-packaged-x86_64-unsigned.apk

        sha256sum dist/omniget-packaged-x86_64-unsigned.apk

        '
    - uses: actions/upload-artifact@v4
      with:
        name: omniget-packaged-x86_64-unsigned
        path: dist/omniget-packaged-x86_64-unsigned.apk
        retention-days: 1
        if-no-files-found: error
'on':
  push:
    branches:
    - phone-integrated-repairs-20261124
    paths:
    - .github/workflows/phone-packaged-acceptance.yml
