name: Full Tauri Android packaged acceptance build
concurrency:
  group: phone-integrated-packaged
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_TARGET: x86_64
    steps:
    - uses: actions/checkout@v7
    - name: Apply exact reviewed phone frontend and native source deltas
      run: "python3 - <<'PYCODE'\nimport pathlib,lzma,base64\nfor name in ['frontend','native']:\n text=''.join(pathlib.Path(f'phone-{name}-part{i}.b64xz').read_text().strip() for i in [1,2])\n pathlib.Path('/tmp/'+name+'.patch').write_bytes(lzma.decompress(base64.b64decode(text)))\nPYCODE\ngit apply --check /tmp/frontend.patch && git apply /tmp/frontend.patch\ngit apply --check /tmp/native.patch && git apply /tmp/native.patch\npython3 - <<'LOCALES'\nimport base64,lzma,json,pathlib\nx=json.loads(lzma.decompress(base64.b64decode('')))\ndef merge(a,b):\n for k,v in b.items():\n  if isinstance(v,dict)and isinstance(a.get(k),dict):merge(a[k],v)\n  else:a[k]=v\nfor name,patch in x.items():\n p=pathlib.Path('src/lib/i18n')/name;a=json.loads(p.read_text());merge(a,patch);p.write_text(json.dumps(a,ensure_ascii=False))\nLOCALES\n\npython3 - <<'FOLLOWON'\nimport base64,lzma,pathlib\npathlib.Path('/tmp/followon.patch').write_bytes(lzma.decompress(base64.b64decode(pathlib.Path('phone-art-followon.b64xz').read_text())))\nFOLLOWON\ngit apply --check /tmp/followon.patch\ngit apply /tmp/followon.patch\n"
    - name: Apply current reviewed local application corrections
      run: "python3 - <<'CURRENT'\nimport base64,lzma,tarfile,io,pathlib,subprocess\nroot=pathlib.Path('/tmp/current-source');root.mkdir()\ntarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n''\n)))).extractall(root)\nfor patch in (root/'patches').rglob('*.patch'):\n subprocess.run(['git','apply','--recount',str(patch)],check=True)\nfor source in (root/'files').rglob('*'):\n if source.is_file():\n  target=pathlib.Path(source.relative_to(root/'files'));target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(source.read_bytes())\nCURRENT\npython3 - <<'PLAYERLABELS'\nimport pathlib,json,lzma,base64\nfor name,labels in json.loads(lzma.decompress(base64.b64decode(''))).items():\n p=pathlib.Path(name);data=json.loads(p.read_text());data.update(labels);p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n')\nPLAYERLABELS\n"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install NDK and build tools
      run: "SDKM=\"$(ls -d \"$ANDROID_HOME\"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)\"\nyes | \"$SDKM\" --licenses >/dev/null || true\n\"$SDKM\" \"platforms;android-34\" \"build-tools;34.0.0\" \"ndk;27.0.12077973\"\necho \"ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973\" >> \"$GITHUB_ENV\"\necho \"NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973\" >> \"$GITHUB_ENV\"\n\n# NDK r23+ dropped the `<triple>-ranlib` / `-ar` binutils names and\n# ships only llvm-* tools. The vendored OpenSSL build still looks for\n# the old names, so expose them as symlinks on PATH.\nNDKBIN=\"$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin\"\nSHIMS=\"$HOME/ndk-shims\"\nmkdir -p \"$SHIMS\"\nfor triple in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do\n  for tool in ar ranlib strip nm; do\n    ln -sf \"$NDKBIN/llvm-$tool\" \"$SHIMS/$triple-$tool\"\n  done\ndone\necho \"$SHIMS\" >> \"$GITHUB_PATH\"\necho \"$NDKBIN\" >> \"$GITHUB_PATH\"\n"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ./src-tauri
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
    - name: Generate the Android project
      run: pnpm tauri android init --ci
    - name: Test Android runtime patcher
      run: 'python3 .github/android/test_android_dependency_scope.py

        python3 .github/android/test_patch_project.py

        python3 .github/android/test_resume_policy.py

        python3 .github/android/test_download_startup.py

        '
    - name: Bundle yt-dlp, Python and ffmpeg
      run: 'python3 .github/android/patch_project.py

        python3 .github/android/test_download_startup.py --yt-dlp src-tauri/gen/android/app/src/main/res/raw/omniget_ytdlp

        '
    - name: Test gallery registration and filenames
      run: 'python3 .github/android/test_gallery_registration.py

        rustc --edition 2021 --test .github/android/media_names.rs -o /tmp/media-names-test

        /tmp/media-names-test

        '
    - name: Build release APK
      run: '# Stamp the build so the in-app updater can tell whether the

        # android-latest release is newer than the installed APK.

        export LIBREGET_BUILD_SHA="$GITHUB_SHA"

        export LIBREGET_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        pnpm tauri android build --apk --target "$ANDROID_TARGET" --ci

        '
    - name: Collect full unsigned x86_64 application, not release promotion
      run: 'mkdir -p dist

        find src-tauri/gen/android -name ''*.apk'' -type f -print

        APK="$(find src-tauri/gen/android/app/build/outputs -name ''*.apk'' -type f | head -1)"

        test -n "$APK"

        cp "$APK" dist/omniget-packaged-x86_64-unsigned.apk

        sha256sum dist/omniget-packaged-x86_64-unsigned.apk

        '
    - uses: actions/upload-artifact@v4
      with:
        name: omniget-packaged-x86_64-unsigned
        path: dist/omniget-packaged-x86_64-unsigned.apk
        retention-days: 1
        if-no-files-found: error
'on':
  push:
    branches:
    - phone-integrated-repairs-20261124
    paths:
    - .github/workflows/phone-packaged-acceptance.yml
