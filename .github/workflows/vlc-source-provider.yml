name: Source-built VLC Android XML provider arm64 candidate internal only
'on':
  push:
    branches:
    - phone-integrated-repairs-20261124
    paths:
    - .github/workflows/vlc-source-provider.yml
permissions:
  contents: read
jobs:
  vlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Build source-controlled candidate without app integration
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y autoconf automake libtool libtool-bin gettext autopoint cmake ninja-build meson gperf bison flex nasm pkg-config ant help2man texinfo python3-setuptools\nmkdir -p /tmp/vlc-source\ncd /tmp/vlc-source\ngit clone --branch libvlcjni-3.x https://code.videolan.org/videolan/libvlcjni.git libvlcjni-src\ngit -C libvlcjni-src checkout 0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6\ngit clone --branch 3.0.x https://code.videolan.org/videolan/vlc.git vlc-src\ngit -C vlc-src checkout 84177b2273abc5c4300234e6e18b55a4d2dd5a03\ngit -C vlc-src config user.name InternalValidation\ngit -C vlc-src config user.email validation@localhost\ngit -C vlc-src am --keep-cr /tmp/vlc-source/libvlcjni-src/libvlc/patches/*.patch\nln -s ../vlc-src libvlcjni-src/vlc\npython3 - <<'PROVIDERPATCH'\nfrom pathlib import Path\nr=Path('/tmp/vlc-source');p=r/'vlc-src/modules/text_renderer/freetype/freetype.c';s=p.read_text();needle='/* Android */\\n#ifdef __ANDROID__\\n';s=s.replace(needle,needle+'# undef HAVE_FONTCONFIG /* Use platform XML mapping, not an eager full font scan. */\\n',1);p.write_text(s)\np=r/'vlc-src/modules/text_renderer/freetype/fonts/android.c';s=p.read_text();s=s.replace('#include \"../platform_fonts.h\"','#include \"../platform_fonts.h\"\\n#include <unistd.h>');s=s.replace('int               i_weight    = 0;','int               i_weight    = 400;\\n    int               i_index     = 0;',1);needle='''        if( !strcasecmp( \"weight\", psz_attr ) && psz_val && *psz_val )\n            i_weight = atoi( psz_val );''';s=s.replace(needle,needle+'''\n        else if( !strcasecmp( \"index\", psz_attr ) && psz_val && *psz_val )\n            i_index = atoi( psz_val );''',1);s=s.replace('if( i_weight == 700 )','if( i_weight >= 600 )',1);s=s.replace('if( i_weight == 400 || i_weight == 700 )','if( i_weight >= 1 && i_weight <= 1000 && i_index >= 0 )',1)\na=s.index('        psz_fontfile = malloc( sizeof(ANDROID_FONT_PATH)');b=s.index('\\n    }\\n\\n    return VLC_SUCCESS;',a);s=s[:a]+'''        char *psz_name = strndup( psz_val, len );\n        if( !psz_name ) return VLC_ENOMEM;\n        const char *roots[] = { \"/system/fonts\", \"/product/fonts\", \"/system_ext/fonts\", \"/vendor/fonts\" };\n        psz_fontfile = NULL;\n        if( psz_name[0] == '/' )\n        {\n            if( access( psz_name, R_OK ) == 0 ) psz_fontfile = strdup( psz_name );\n        }\n        else for( size_t i = 0; i < sizeof(roots)/sizeof(roots[0]); i++ )\n        {\n            char *candidate = NULL;\n            if( asprintf( &candidate, \"%s/%s\", roots[i], psz_name ) < 0 )\n            { free( psz_name ); return VLC_ENOMEM; }\n            if( access( candidate, R_OK ) == 0 ) { psz_fontfile = candidate; break; }\n            free( candidate );\n        }\n        free( psz_name );\n        if( !psz_fontfile ) return VLC_SUCCESS;\n        vlc_font_t *font = NewFont( psz_fontfile, i_index, b_bold, b_italic, p_family );\n        /* NewFont owns psz_fontfile. */\n        if( !font ) return VLC_ENOMEM;'''+s[b:]\n# Additional Android OEM font families remain fallback candidates, preserving aliases.\ns=s.replace('''    return VLC_SUCCESS;\n}\n\nconst vlc_family_t *Android_GetFamily''','''    if( Android_ParseSystemFonts( p_filter, \"file:///product/etc/fonts_customization.xml\", true ) == VLC_ENOMEM )\n        return VLC_ENOMEM;\n    return VLC_SUCCESS;\n}\n\nconst vlc_family_t *Android_GetFamily''');p.write_text(s)\n# JNI skips only the obsolete pre-scan. Font mapping is loaded by Android_Prepare at text renderer creation.\np=r/'libvlcjni-src/libvlc/jni/libvlcjni.c';s=p.read_text();a=s.index('    clean_font_cache_leftovers();',s.index('jboolean Java_org_videolan_libvlc_LibVLC_nativeBuildFontCache'));b=s.index('\\n}',a);s=s[:a]+'''    /* Android XML provider loads system/OEM font names and fallback mappings on\n     * demand. It does not need the unrelated FontConfig disk cache. */\n    return JNI_TRUE;'''+s[b:];p.write_text(s)\nprint('candidate patched, no application integration')\n\nPROVIDERPATCH\npython3 - <<'BUILDFIX'\nfrom pathlib import Path\np=Path('/tmp/vlc-source/vlc-src/contrib/src/main.mak');s=p.read_text().replace('CMAKE = cmake -S $<','CMAKE = cmake -DCMAKE_POLICY_DEFAULT_CMP0057=NEW -S $<');p.write_text(s)\nBUILDFIX\n\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" 'ndk;27.0.12077973'\nexport ANDROID_NDK=\"$ANDROID_HOME/ndk/27.0.12077973\" ANDROID_SDK=\"$ANDROID_HOME\" MAKEFLAGS=-j4\nmkdir -p /tmp/ninja-wrapper\nprintf '%s\\n' '#!/bin/sh' 'unset MAKEFLAGS MFLAGS' 'exec /usr/bin/ninja \"$@\"' > /tmp/ninja-wrapper/ninja\nchmod +x /tmp/ninja-wrapper/ninja\nexport PATH=\"/tmp/ninja-wrapper:$PATH\"\ncd libvlcjni-src\n./buildsystem/compile-libvlc.sh -a arm64-v8a > /tmp/vlc-source-build.log 2>&1 || { tail -160 /tmp/vlc-source-build.log; exit 1; }\nmkdir -p /tmp/vlc-candidate/arm64-v8a\ncp libvlc/jni/libs/arm64-v8a/*.so /tmp/vlc-candidate/arm64-v8a/\ngit diff --binary > /tmp/vlc-candidate/libvlcjni-provider.patch\ngit -C ../vlc-src diff --binary > /tmp/vlc-candidate/vlc-provider.patch\ncp /tmp/vlc-source-build.log /tmp/vlc-candidate/\ncd /tmp/vlc-candidate\nsha256sum arm64-v8a/*.so > SHA256SUMS\ncat SHA256SUMS\n\n# Preserve exact commits and dependency source metadata with internal output.\n{ git -C /tmp/vlc-source/libvlcjni-src rev-parse HEAD; git -C /tmp/vlc-source/vlc-src rev-parse HEAD; \"$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang\" --version; } > /tmp/vlc-candidate/BUILD_PROVENANCE.txt\ncp /tmp/vlc-source/libvlcjni-src/buildsystem/compile-libvlc.sh /tmp/vlc-candidate/\ncp /tmp/vlc-source/vlc-src/config.log /tmp/vlc-candidate/vlc-config.log || true\nfind /tmp/vlc-source/vlc-src/contrib -maxdepth 3 -name SHA512SUMS -exec cat {} + > /tmp/vlc-candidate/CONTRIB_SHA512SUMS\n"
    - uses: actions/upload-artifact@v4
      with:
        name: vlc-xml-provider-arm64-internal
        path: /tmp/vlc-candidate
        retention-days: 7
        if-no-files-found: error
      if: always()
