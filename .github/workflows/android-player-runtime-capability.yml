    - name: Install exact full build with test-only signature and run actual-origin checks
      run: "set -euxo pipefail\ntrap 'cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;google_apis;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;google_apis;x86_64'\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -avd player-proof -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\n\"$ADB\" shell input keyevent 82\nBT=\"$ANDROID_HOME/build-tools/35.0.0\"\ntest -x \"$BT/apksigner\" || \"$SDKMANAGER\" 'build-tools;35.0.0'\nkeytool -genkeypair -keystore /tmp/test-signing.jks -storepass android -keypass android -alias androiddebugkey -dname CN=TEST-ONLY -keyalg RSA -validity 2\n\"$BT/zipalign\" -f -P 16 4 /tmp/combined/omniget-x86-validation-unsigned.apk /tmp/combined/aligned.apk\n\"$BT/apksigner\" sign --ks /tmp/test-signing.jks --ks-pass pass:android --key-pass pass:android --out /tmp/combined/installed-test-only.apk /tmp/combined/aligned.apk\n\"$BT/apksigner\" sign --ks /tmp/test-signing.jks --ks-pass pass:android --key-pass pass:android /tmp/installed-proof/app/build/outputs/apk/debug/app-debug.apk\n\"$ADB\" install /tmp/combined/installed-test-only.apk\n\"$ADB\" install /tmp/installed-proof/app/build/outputs/apk/debug/app-debug.apk\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.READ_MEDIA_VIDEO\n\"$ADB\" shell pm grant com.openselena.libreget android.permission.READ_MEDIA_AUDIO\n\"$ADB\" logcat -c\ntimeout 180 \"$ADB\" shell am instrument -w com.omniget.proof/com.omniget.proof.InstalledProof | tee /tmp/installed-result.txt\nfor name in installed-startup installed-downloads installed-player installed-owner-login; do\n \"$ADB\" pull \"/sdcard/Android/data/com.openselena.libreget/files/$name.png\" \"/tmp/$name.png\" || true\n if test -s \"/tmp/$name.png\"; then echo \"VISUAL_${name}_BEGIN\";base64 -w 0 \"/tmp/$name.png\";echo;echo \"VISUAL_${name}_END\";fi\ndone\n\"$ADB\" logcat -d -s AndroidRuntime:E RustStdoutStderr:V chromium:E | tail -100\ngrep INSTALLED_ORIGIN_BRIDGE_UI_PASS /tmp/installed-result.txt\n\"$ADB\" emu kill\n"
