name: Android emulator capability (no release)
on:
  push:
    branches: [android-player-runtime-capability-20261123]
    paths: [.github/workflows/android-player-runtime-capability.yml]
permissions: {}
jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialize isolated native test sources, no full-app or release build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/player-proof
          cd /tmp/player-proof
          python3 - <<'PYCODE'
          import base64,tarfile,io
          tarfile.open(fileobj=io.BytesIO(base64.b64decode(""))).extractall('.')
          PYCODE
          echo MATERIALIZED_OK
          chmod +x gradlew
          command -v ffmpeg
          echo FFMPEG_FOUND
          timeout 45 ffmpeg -nostdin -y -threads 1 -v error -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 35 -c:v mpeg4 -q:v 8 -c:a aac app/src/main/res/raw/fixture.mp4
      - name: Build test-only x86_64 package and instrumentation
        shell: bash
        run: |
          cd /tmp/player-proof
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Boot accelerated emulator and run actual playback acceptance
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install emulator 'system-images;android-35;google_apis;x86_64' 'platform-tools'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name player-proof --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd player-proof -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" wait-for-device
          for i in $(seq 1 120); do if [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi; sleep 2; done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ADB" shell input keyevent 82
          "$ADB" install -r /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -r /tmp/player-proof/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ADB" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-result.txt
          grep NATIVE_PLAYBACK_SEEK_PAUSE_RESUME_PASS /tmp/player-result.txt
          "$ADB" shell am start -n com.openselena.libreget.runtimeproof/com.openselena.libreget.HarnessActivity
          sleep 2
          "$ADB" shell screencap -p /sdcard/runtime.png
          "$ADB" pull /sdcard/runtime.png /tmp/native-player-runtime.png
          echo 'SCREENSHOT_BASE64_BEGIN'
          base64 -w 0 /tmp/native-player-runtime.png
          echo
          echo 'SCREENSHOT_BASE64_END'
          "$ADB" shell am force-stop com.openselena.libreget.runtimeproof
          "$ADB" emu kill
