    - name: Build test-only x86_64 package and instrumentation
      shell: bash
      run: 'cd /tmp/player-proof

        ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2

        '
    - name: Boot accelerated emulator and run actual playback acceptance
      timeout-minutes: 10
      shell: bash
      run: "set -euxo pipefail\ntrap 'cat /tmp/emulator.log || true; timeout 10 \"$ANDROID_HOME/platform-tools/adb\" logcat -d -s VLC:V VLC/LibVLC:V VLC/JNI/VLCObject:V VLC/JNI/AWindow:V OmnigetProof:V AndroidRuntime:E || true' EXIT\nsudo chmod 666 /dev/kvm\ntest -r /dev/kvm\ntest -w /dev/kvm\nSDKMANAGER=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n\"$SDKMANAGER\" --install emulator 'system-images;android-35;google_apis;x86_64' 'platform-tools'\nexport ANDROID_AVD_HOME=\"$HOME/.android/avd\"\nmkdir -p \"$ANDROID_AVD_HOME\"\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force --name player-proof --path \"$ANDROID_AVD_HOME/player-proof.avd\" --package 'system-images;android-35;google_apis;x86_64'\nfind \"$HOME/.android\" -maxdepth 3 -name '*.ini' -print\n\"$ANDROID_HOME/emulator/emulator\" -list-avds\ntest -f \"$ANDROID_AVD_HOME/player-proof.ini\"\n\"$ANDROID_HOME/emulator/emulator\" -avd player-proof -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &\nADB=\"$ANDROID_HOME/platform-tools/adb\"\nif ! timeout 90 \"$ADB\" wait-for-device; then cat /tmp/emulator.log; exit 1; fi\nfor i in $(seq 1 120); do if [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" = 1 ]; then break; fi; sleep 2; done\nif [ \"$(timeout 8 \"$ADB\" shell getprop sys.boot_completed | tr -d '\\r')\" != 1 ]; then cat /tmp/emulator.log; \"$ADB\" logcat -d -t 200; exit 1; fi\n\"$ADB\" shell input keyevent 82\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/debug/app-debug.apk\ntimeout 45 \"$ADB\" install -r /tmp/player-proof/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk\n\"$ADB\" logcat -c\n\"$ADB\" logcat -v threadtime > /tmp/player-live.log 2>&1 &\nLOGPID=$!\nfor cycle in 1; do\n  \"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n  timeout 180 \"$ADB\" shell am instrument -w com.openselena.libreget.runtimeproof.test/com.openselena.libreget.RuntimeProof | tee /tmp/player-result.txt\n  timeout 15 \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat cache/runtime-reference.png > /tmp/native-reference.png || true\n  echo REFERENCE_SCREENSHOT_BEGIN\n  base64 -w 0 /tmp/native-reference.png\n  echo\n  echo REFERENCE_SCREENSHOT_END\n  if ! grep NATIVE_PLAYBACK_SEEK_PAUSE_RESUME_PASS /tmp/player-result.txt; then grep -E 'OmnigetProof|VLC|MediaCodec|CCodec|AWindow|SurfaceView|AudioTrack' /tmp/player-live.log | tail -350; kill \"$LOGPID\"; exit 1; fi\n  echo \"COLD_START_CYCLE_${cycle}_PASS\"\ndone\ngrep -E 'OmnigetProof|VLC|MediaCodec|CCodec|AWindow|SurfaceView|AudioTrack' /tmp/player-live.log | tail -350\nkill \"$LOGPID\"\ntimeout 15 \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat cache/runtime.png > /tmp/native-player-runtime.png\nfor image in polished-portrait polished-landscape; do\n  \"$ADB\" exec-out run-as com.openselena.libreget.runtimeproof cat \"cache/$image.png\" > \"/tmp/$image.png\"\n  echo \"VISUAL_${image}_BEGIN\"\n  base64 -w 0 \"/tmp/$image.png\"\n  echo\n  echo \"VISUAL_${image}_END\"\ndone\necho 'SCREENSHOT_BASE64_BEGIN'\nbase64 -w 0 /tmp/native-player-runtime.png\necho\necho 'SCREENSHOT_BASE64_END'\ngrep NATIVE_PLAYBACK_SEEK_PAUSE_RESUME_PASS /tmp/player-result.txt\n\"$ADB\" shell am force-stop com.openselena.libreget.runtimeproof\n\"$ADB\" emu kill\n"
