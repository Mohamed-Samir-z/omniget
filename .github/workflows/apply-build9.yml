name: Apply reviewed Build 9 sources
on:
  push:
    branches: [android-build9]
    paths: [.github/workflows/apply-build9.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build9
      - name: Apply exact reviewed source delta
        env:
          PATCH_PART_0: 
          PATCH_PART_1: 
          PATCH_PART_2: 
          PATCH_PART_3: 
          PATCH_PART_4: 
          PATCH_PART_5: 
          PATCH_PART_6: 
          PATCH_SHA256: 833d9597d7b0d24c678f391873941c99507b9a39d2e10e39339aeb186b3d2257
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(''.join(os.environ['PATCH_PART_%d' % i] for i in range(7))))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build9.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build9.patch
          git apply /tmp/build9.patch
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/apply-build9.yml .github/workflows/.github/workflows/apply-build9.yml
          git add -A src-tauri src .github/android .github/workflows
          git commit -m 'Android Build 9: Arabic, recovery choices, safe reports, history and first-paint repair'
          git push origin HEAD:android-build9
