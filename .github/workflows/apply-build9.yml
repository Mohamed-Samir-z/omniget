name: Apply reviewed Build 9 multi-audio sources
on:
  push:
    branches: [android-build9]
    paths: [.github/workflows/apply-build9.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build9
      - name: Apply exact reviewed source delta
        env:
          PATCH_PART_0: 
          PATCH_SHA256: 30df5266e34f7c75004e29fd7850f1e1759f6a1d18d85a43a3b20425ce784ecc
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(''.join(os.environ['PATCH_PART_%d' % i] for i in range(1))))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build9.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build9.patch
          git apply /tmp/build9.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/apply-build9.yml
          git add -A src-tauri src .github/android .github/workflows
          git commit -m 'Use concise audio alert and labeled language badges'
          git push origin HEAD:android-build9
