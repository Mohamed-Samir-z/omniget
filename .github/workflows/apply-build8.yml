name: Apply reviewed Build 8 sources
on:
  push:
    branches: [android-build8]
    paths: [.github/workflows/apply-build8.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: android-build8
      - name: Apply exact source delta
        env:
          PATCH_PART_0: 
          PATCH_PART_1: 
          PATCH_PART_2: 
          PATCH_PART_3: 
          PATCH_SHA256: e7d10ee14fce5982bd09fd278bfc98c67d4a030148ff62e227e8a293e1168c70
        run: |
          python3 - <<'PYCODE'
          import os, base64, zlib, hashlib, pathlib
          patch = zlib.decompress(base64.b64decode(''.join(os.environ['PATCH_PART_%d' % i] for i in range(4))))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          pathlib.Path('/tmp/build8.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/build8.patch
          git apply /tmp/build8.patch
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install yt-dlp
          cargo test --manifest-path .github/android/clip-tests/Cargo.toml
          cargo build --manifest-path .github/android/clip-tests/Cargo.toml
          python3 .github/android/clip-tests/check_sections.py
          python3 .github/android/clip-tests/check_normalization.py
          python3 .github/android/test_patch_project.py
          python3 .github/android/test_resume_policy.py
          python3 .github/android/test_build4.py
          python3 .github/android/test_share_popup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/apply-build8.yml .github/workflows/.github/workflows/apply-build8.yml
          git add -A src-tauri src static/developer .github/android .github/workflows
          git commit -m 'Android: file actions, captions, system schedules, developer card and startup repairs'
          git push origin HEAD:android-build8
