name: Apply reviewed build12 CI repair
'on':
  push:
    branches:
    - android-build12-caption-notification
    paths:
    - .github/workflows/apply-build12-ci-repair.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: android-build12-caption-notification
        fetch-depth: 2
    - name: Apply exact reviewed three-file repair and remove helper
      env:
        DELTA_B64: 
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD^)" = "a027c9888d1a3e2f54c534fda9e0a7009ec59721"

        test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-build12-ci-repair.yml"

        test "$(sha256sum .github/workflows/android.yml | cut -d'' '' -f1)" = "7a894b2bf63f5d55515b355f3ad544df2567bac7c5379be52f91a8288a0feb9d"

        printf ''%s'' "$DELTA_B64" | base64 --decode | gzip --decompress > /tmp/reviewed.patch

        printf ''c5f39b4500850acb4180dc90f415801a49a667e878aab6063da31410f26b0d1a  /tmp/reviewed.patch

        '' | sha256sum --check -

        git apply --check --whitespace=error /tmp/reviewed.patch

        git apply --whitespace=error /tmp/reviewed.patch

        git diff --check

        test "$(sha256sum .github/workflows/android.yml | cut -d'' '' -f1)" = "7a894b2bf63f5d55515b355f3ad544df2567bac7c5379be52f91a8288a0feb9d"

        rm .github/workflows/apply-build12-ci-repair.yml

        git add -A

        test "$(git write-tree)" = "3dd7c7fa2fafa5c35f680aa564427acbec557bb4"

        git config user.name github-actions[bot]

        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

        git commit -m ''Fix shared queue constructor and desktop defaults compilation''

        git push origin HEAD:refs/heads/android-build12-caption-notification

        git rev-parse HEAD

        '
